# アクティビティ → WSTG-ID 対応表（機械可読）
#
# 設計思想: WSTG 項目を1件ずつ潰すのではなく、「1回の収集アクティビティ」で
# 複数の WSTG-ID に一括でチェックを入れる。1つの WSTG-ID を複数アクティビティが
# カバーしてよい（role: primary / secondary で主従を示す）。
#
# ここ（activities:）が唯一の手編集ポイント。
# 末尾の by_activity / by_wstg と matrix/coverage.md は
#   python scripts/build_coverage.py
# で再生成される。
#
# role:
#   primary   … このアクティビティ単独で当該 WSTG-ID の判定まで到達できる
#   secondary … 入力・補強にはなるが、単独では判定を確定させない

activities:
  - id: recon-osint
    title: 外部 OSINT・公開情報の収集
    summary: 検索エンジン・証明書透明性ログ・whois から、対象の公開露出面とサブドメインを洗い出す。
    tools: [theHarvester, "crt.sh", whois, "Google/Bing dorking", amass]
    outputs: [artifacts/subdomains.txt, artifacts/dorking-hits.md, cmd/whois.txt]
    covers:
      - {id: WSTG-INFO-01, role: primary, note: "検索エンジンに残った情報漏えいの有無"}
      - {id: WSTG-CONF-10, role: secondary, note: "サブドメイン列挙が乗っ取り判定の入力"}

  - id: fingerprint-stack
    title: サーバ・フレームワークのフィンガープリント
    summary: ポート/サービス/ヘッダ/既知の指紋から、OS・Web サーバ・ミドルウェア・アプリ基盤を特定する。
    tools: ["nmap -sV", whatweb, Wappalyzer, httpx]
    outputs: [cmd/nmap-sv.txt, cmd/whatweb.txt, artifacts/stack-summary.md]
    covers:
      - {id: WSTG-INFO-02, role: primary}
      - {id: WSTG-INFO-08, role: primary}
      - {id: WSTG-CONF-01, role: secondary, note: "露出サービス一覧がネットワーク構成レビューの入力"}
      - {id: WSTG-CONF-02, role: secondary, note: "既知の既定構成・バージョンの手掛かり"}

  - id: tls-scan
    title: TLS 設定スキャン
    summary: 対象の全 TLS ポートに対して暗号スイート・プロトコル・証明書・HSTS を一括検査する。
    tools: ["testssl.sh", sslyze, "nmap --script ssl-enum-ciphers"]
    outputs: [cmd/testssl.txt, artifacts/tls-summary.md]
    covers:
      - {id: WSTG-CRYP-01, role: primary}
      - {id: WSTG-CONF-07, role: primary, note: "HSTS ヘッダの有無・max-age・includeSubDomains"}
      - {id: WSTG-CONF-01, role: secondary, note: "TLS を終端する構成要素の把握"}

  - id: http-methods
    title: HTTP メソッドの列挙と検証
    summary: OPTIONS 応答を鵜呑みにせず、実際に各メソッドを投げて許可状況と挙動差を確認する。
    tools: [curl, "nmap http-methods NSE", ncat, Burp Repeater]
    outputs: [cmd/curl-options.txt, cmd/nmap-http-methods.txt]
    covers:
      - {id: WSTG-CONF-06, role: primary}
      - {id: WSTG-INPV-03, role: secondary, note: "v4.2 では CONF-06 に統合（HTTP verb tampering）"}

  - id: headers-review
    title: レスポンスヘッダ一括精査（匿名 + 認証済み）
    summary: 代表エンドポイントについて匿名・認証済みの応答を1セット取得し、セキュリティ関連ヘッダを横断レビューする。
    tools: [curl, Burp Suite, "securityheaders.io 相当の手動チェック"]
    outputs: [cmd/curl-headers-anon.txt, cmd/curl-headers-authn.txt, artifacts/headers-matrix.md]
    covers:
      - {id: WSTG-SESS-02, role: primary, note: "Set-Cookie の Secure/HttpOnly/SameSite/Domain/Path/prefix"}
      - {id: WSTG-CONF-07, role: primary, note: "Strict-Transport-Security"}
      - {id: WSTG-CLNT-09, role: primary, note: "X-Frame-Options / CSP frame-ancestors"}
      - {id: WSTG-ATHN-06, role: primary, note: "Cache-Control / Pragma（認証済み画面のブラウザキャッシュ）"}
      - {id: WSTG-CLNT-07, role: primary, note: "Access-Control-Allow-Origin 等の CORS ヘッダ（旧指示の CONF-12 に相当）"}
      - {id: WSTG-CRYP-03, role: secondary, note: "平文チャネルでの機微情報送出の兆候"}

  - id: metafiles-crawl
    title: メタファイル・公開コンテンツの収集
    summary: robots.txt・sitemap・.well-known・security.txt・HTML コメント・JS ソースを機械収集して読み込む。
    tools: [curl, wget, "grep/ripgrep", Burp Suite]
    outputs: [cmd/curl-robots.txt, cmd/curl-wellknown.txt, artifacts/comments-grep.txt]
    covers:
      - {id: WSTG-INFO-03, role: primary}
      - {id: WSTG-INFO-05, role: primary, note: "HTML コメント・JS 内の情報漏えい"}
      - {id: WSTG-CONF-05, role: secondary, note: "robots.txt の Disallow が管理画面の入力になる"}

  - id: enum-apps
    title: 仮想ホスト・パスの列挙
    summary: DNS/vhost と URL パスをファジングし、同一ホスト上の別アプリ・別インスタンスを洗い出す。
    tools: [ffuf, dirsearch, gobuster, "nmap -p-"]
    outputs: [cmd/ffuf-paths.txt, cmd/ffuf-vhost.txt, artifacts/app-inventory.md]
    covers:
      - {id: WSTG-INFO-04, role: primary}
      - {id: WSTG-INFO-06, role: secondary, note: "発見したパスがエントリポイント洗い出しの入力"}

  - id: burp-crawl-authn
    title: 認証済みクロールとエントリポイント洗い出し
    summary: 認証済みセッションでアプリ全体をクロールし、エントリポイント・実行パス・アーキテクチャを把握する。
    tools: [Burp Suite, OWASP ZAP]
    outputs: [artifacts/entry-points.txt, artifacts/sitemap.xml, notes.md]
    covers:
      - {id: WSTG-INFO-06, role: primary}
      - {id: WSTG-INFO-07, role: primary}
      - {id: WSTG-INFO-10, role: primary, note: "経路上の WAF・LB・API GW の推定"}
      - {id: WSTG-CONF-05, role: primary, note: "管理インタフェースの実在確認"}

  - id: session-capture
    title: セッション取得とログイン/ログアウト解析
    summary: ログイン〜操作〜ログアウトを1本のトレースとして取得し、トークンの生成・維持・破棄を追う。
    tools: [Burp Suite, "Burp Sequencer", curl]
    outputs: [artifacts/session-trace.burp, artifacts/token-samples.txt, notes.md]
    covers:
      - {id: WSTG-SESS-01, role: primary}
      - {id: WSTG-SESS-02, role: primary}
      - {id: WSTG-SESS-03, role: primary, note: "ログイン前後でトークンが再発行されるか"}
      - {id: WSTG-SESS-06, role: primary}
      - {id: WSTG-SESS-07, role: primary}
      - {id: WSTG-SESS-09, role: secondary, note: "取得したトークンの再利用可否の入力"}

  - id: backup-unref
    title: 旧・バックアップ・未参照ファイルの探索
    summary: 拡張子とファイル名のバリエーションを総当たりし、公開されている残骸ファイルを探す。
    tools: [ffuf, dirsearch, nikto]
    outputs: [cmd/ffuf-backup.txt, artifacts/found-files.md]
    covers:
      - {id: WSTG-CONF-03, role: primary}
      - {id: WSTG-CONF-04, role: primary}

  # --- 以下、初期10アクティビティで未カバーだった WSTG 項目を埋めるために追加 ---

  - id: server-config-review
    title: サーバ／プラットフォーム構成レビュー
    summary: 構成ファイル・配置・権限・不要機能を（可能なら読み取り権限を得て）レビューする。ホスト側の情報提供が前提。
    tools: [手動レビュー, "ls -l / icacls", nikto, "CIS Benchmark チェックリスト"]
    outputs: [artifacts/config-review.md, notes.md]
    covers:
      - {id: WSTG-CONF-01, role: primary}
      - {id: WSTG-CONF-02, role: primary}
      - {id: WSTG-CONF-09, role: primary, note: "ファイル・ディレクトリのパーミッション"}

  - id: cloud-and-takeover
    title: クラウドストレージ・サブドメイン乗っ取りの確認
    summary: 公開バケット等のストレージ露出と、宙に浮いた DNS レコードによる乗っ取り可能性を確認する。
    tools: [curl, "aws cli", subjack, dnsx]
    outputs: [cmd/curl-bucket.txt, artifacts/dangling-dns.md]
    covers:
      - {id: WSTG-CONF-11, role: primary}
      - {id: WSTG-CONF-10, role: primary}

  - id: ria-legacy-check
    title: RIA クロスドメインポリシーとレガシー Flash の確認
    summary: crossdomain.xml / clientaccesspolicy.xml と、残存する Flash/Silverlight コンテンツを確認する。
    tools: [curl, 手動レビュー]
    outputs: [cmd/curl-crossdomain.txt, artifacts/ria-findings.md]
    covers:
      - {id: WSTG-CONF-08, role: primary}
      - {id: WSTG-CLNT-08, role: primary}

  - id: identity-model-review
    title: ロール定義・登録・払い出しプロセスのレビュー
    summary: ドキュメントとヒアリング＋実機で、ロール定義・アカウント登録・払い出し・ユーザ名ポリシーを確認する。
    tools: [手動レビュー, ヒアリング, Burp Suite]
    outputs: [artifacts/role-matrix.md, notes.md]
    covers:
      - {id: WSTG-IDNT-01, role: primary}
      - {id: WSTG-IDNT-02, role: primary}
      - {id: WSTG-IDNT-03, role: primary}
      - {id: WSTG-IDNT-05, role: primary}

  - id: account-enum-probe
    title: アカウント列挙とロックアウトの検証
    summary: ログイン・登録・パスワードリセットの応答差（本文・ステータス・応答時間）を比較し、ロックアウト挙動も測る。
    tools: [Burp Intruder, ffuf, curl]
    outputs: [cmd/enum-responses.txt, artifacts/response-diff.md]
    covers:
      - {id: WSTG-IDNT-04, role: primary}
      - {id: WSTG-ATHN-03, role: primary, note: "試行回数と解除条件"}
      - {id: WSTG-IDNT-05, role: secondary}

  - id: authn-flow-review
    title: 認証フロー一括レビュー
    summary: 認証の入口をひと通り触り、経路暗号化・既定資格情報・スキーマ迂回・記憶機能・パスワードポリシー・代替チャネルをまとめて確認する。
    tools: [Burp Suite, curl, ブラウザ開発者ツール]
    outputs: [artifacts/authn-notes.md, cmd/curl-login.txt]
    covers:
      - {id: WSTG-ATHN-01, role: primary}
      - {id: WSTG-ATHN-02, role: primary}
      - {id: WSTG-ATHN-04, role: primary}
      - {id: WSTG-ATHN-05, role: primary}
      - {id: WSTG-ATHN-06, role: secondary}
      - {id: WSTG-ATHN-07, role: primary}
      - {id: WSTG-ATHN-10, role: primary, note: "モバイル・API・SSO 等の代替入口"}
      - {id: WSTG-CRYP-03, role: primary, note: "資格情報・機微情報が平文チャネルに出ていないか"}

  - id: password-reset-review
    title: パスワード変更・リセット機能のレビュー
    summary: リセットトークンの強度・有効期限・所有確認、秘密の質問の強度を通しで確認する。
    tools: [Burp Suite, メールクライアント, 手動レビュー]
    outputs: [artifacts/reset-flow.md, notes.md]
    covers:
      - {id: WSTG-ATHN-08, role: primary}
      - {id: WSTG-ATHN-09, role: primary}

  - id: authz-matrix
    title: 権限マトリクス試験（ロール横断リクエスト再送）
    summary: 各ロールで採取した代表リクエストを、他ロール・未認証で再送して差分を見る。IDOR は識別子を差し替えて確認。
    tools: [Burp Suite, "Autorize / AuthMatrix", curl]
    outputs: [artifacts/authz-matrix.csv, notes.md]
    covers:
      - {id: WSTG-ATHZ-02, role: primary}
      - {id: WSTG-ATHZ-03, role: primary}
      - {id: WSTG-ATHZ-04, role: primary}
      - {id: WSTG-SESS-08, role: secondary, note: "権限が別ロールへ引き継がれる挙動の兆候"}

  - id: traversal-probe
    title: ディレクトリトラバーサル・ファイルインクルードの検証
    summary: パス・ファイル名を扱うパラメータを洗い出し、トラバーサルと LFI/RFI を確認する。
    tools: [Burp Suite, ffuf, 手動 payload]
    outputs: [cmd/traversal.txt, artifacts/traversal-findings.md]
    covers:
      - {id: WSTG-ATHZ-01, role: primary}
      - {id: WSTG-CONF-03, role: secondary, note: "拡張子の扱いが入力になる"}

  - id: session-abuse-tests
    title: セッションの悪用系テスト（露出・CSRF・パズリング・ハイジャック）
    summary: 取得済みセッションを使って、トークンの露出経路・CSRF 防御・状態の取り違え・再利用可否を検証する。
    tools: [Burp Suite, curl, ブラウザ2枚]
    outputs: [artifacts/csrf-poc.html, artifacts/session-abuse.md]
    covers:
      - {id: WSTG-SESS-04, role: primary, note: "URL・ログ・Referer へのトークン露出"}
      - {id: WSTG-SESS-05, role: primary}
      - {id: WSTG-SESS-08, role: primary}
      - {id: WSTG-SESS-09, role: primary}

  - id: xss-probe
    title: XSS・HTML インジェクションの検証
    summary: 反射・保存・DOM の各経路について、代表入力点にペイロードを流して出力エンコーディングを確認する。
    tools: [Burp Suite, "DOM Invader", 手動 payload]
    outputs: [artifacts/xss-findings.md, artifacts/payloads.txt]
    covers:
      - {id: WSTG-INPV-01, role: primary}
      - {id: WSTG-INPV-02, role: primary}
      - {id: WSTG-CLNT-01, role: primary}
      - {id: WSTG-CLNT-03, role: primary}

  - id: clientside-js-review
    title: クライアントサイド JS のシンク・ストレージレビュー
    summary: JS のソース/シンクを追い、URL リダイレクト・CSS/リソース操作・postMessage・ブラウザストレージ・XSSI をまとめて確認する。
    tools: ["ブラウザ開発者ツール", "DOM Invader", "Retire.js", Burp Suite]
    outputs: [artifacts/js-sinks.md, artifacts/storage-dump.md]
    covers:
      - {id: WSTG-CLNT-02, role: primary}
      - {id: WSTG-CLNT-04, role: primary}
      - {id: WSTG-CLNT-05, role: primary}
      - {id: WSTG-CLNT-06, role: primary}
      - {id: WSTG-CLNT-11, role: primary, note: "postMessage の origin 検証"}
      - {id: WSTG-CLNT-12, role: primary, note: "localStorage / sessionStorage / IndexedDB"}
      - {id: WSTG-CLNT-13, role: primary, note: "XSSI（JSON/JS の外部読み込み）"}

  - id: cors-websocket-check
    title: CORS と WebSocket の検証
    summary: Origin を差し替えた応答差と、WebSocket ハンドシェイク・認可・暗号化を確認する。
    tools: [curl, Burp Suite, "wscat"]
    outputs: [cmd/curl-cors.txt, artifacts/ws-trace.md]
    covers:
      - {id: WSTG-CLNT-07, role: primary}
      - {id: WSTG-CLNT-10, role: primary}

  - id: injection-fuzz-server
    title: サーバサイド・インジェクション系の一括ファジング
    summary: 収集済みエントリポイントに対し、SQL/LDAP/XML/SSI/XPath/IMAP-SMTP/コード/コマンド/書式文字列/SSTI を横断的に試す。
    tools: [Burp Intruder, sqlmap, tplmap, 手動 payload]
    outputs: [cmd/sqlmap.txt, artifacts/injection-findings.md]
    covers:
      - {id: WSTG-INPV-05, role: primary}
      - {id: WSTG-INPV-06, role: primary}
      - {id: WSTG-INPV-07, role: primary}
      - {id: WSTG-INPV-08, role: primary}
      - {id: WSTG-INPV-09, role: primary}
      - {id: WSTG-INPV-10, role: primary}
      - {id: WSTG-INPV-11, role: primary}
      - {id: WSTG-INPV-12, role: primary}
      - {id: WSTG-INPV-13, role: primary}
      - {id: WSTG-INPV-18, role: primary}
      - {id: WSTG-ERRH-01, role: secondary, note: "エラー応答の差分が副産物として得られる"}

  - id: http-request-tamper
    title: HTTP リクエスト改変系の検証
    summary: パラメータ汚染・ヘッダ分割/スマグリング・Host ヘッダ・受信リクエストの扱いをまとめて検証する。
    tools: [Burp Suite, "Burp HTTP Request Smuggler", curl]
    outputs: [artifacts/request-tamper.md, cmd/curl-hosthdr.txt]
    covers:
      - {id: WSTG-INPV-04, role: primary}
      - {id: WSTG-INPV-15, role: primary}
      - {id: WSTG-INPV-16, role: primary}
      - {id: WSTG-INPV-17, role: primary}

  - id: ssrf-probe
    title: SSRF の検証
    summary: URL・ホスト名・ファイル参照を受けるパラメータを列挙し、外向き/内向きの到達性を確認する。
    tools: [Burp Collaborator, "interactsh", curl]
    outputs: [artifacts/ssrf-findings.md, cmd/ssrf-probe.txt]
    covers:
      - {id: WSTG-INPV-19, role: primary}

  - id: error-handling-review
    title: エラーハンドリングのレビュー
    summary: 異常系を意図的に起こし、返る情報量（スタックトレース・SQL エラー・内部パス）を確認する。
    tools: [Burp Suite, curl, 手動]
    outputs: [artifacts/error-samples.md, cmd/curl-errors.txt]
    covers:
      - {id: WSTG-ERRH-01, role: primary}
      - {id: WSTG-ERRH-02, role: secondary, note: "v4.2 では ERRH-01 に統合（スタックトレース）"}
      - {id: WSTG-INFO-05, role: secondary}

  - id: crypto-review
    title: 暗号利用のレビュー（パディングオラクル・弱い暗号・平文送出）
    summary: 暗号化された値の改変応答差、暗号アルゴリズム・鍵管理、平文チャネルでの機微情報送出を確認する。
    tools: [padbuster, "testssl.sh", Burp Suite, 手動レビュー]
    outputs: [artifacts/crypto-review.md, cmd/padbuster.txt]
    covers:
      - {id: WSTG-CRYP-02, role: primary}
      - {id: WSTG-CRYP-03, role: primary}
      - {id: WSTG-CRYP-04, role: primary}

  - id: business-logic-walkthrough
    title: 業務ロジックの通し検証
    summary: 業務フローを正常系→逸脱系で通し、データ妥当性・リクエスト偽造・整合性・時間・回数制限・順序・誤用防御を確認する。
    tools: [Burp Suite, 手動操作, 業務仕様書]
    outputs: [artifacts/logic-scenarios.md, notes.md]
    covers:
      - {id: WSTG-BUSL-01, role: primary}
      - {id: WSTG-BUSL-02, role: primary}
      - {id: WSTG-BUSL-03, role: primary}
      - {id: WSTG-BUSL-04, role: primary}
      - {id: WSTG-BUSL-05, role: primary}
      - {id: WSTG-BUSL-06, role: primary}
      - {id: WSTG-BUSL-07, role: primary}
      - {id: WSTG-INPV-14, role: primary, note: "潜伏型（保存された値が後で発火する）シナリオ"}

  - id: file-upload-tests
    title: ファイルアップロードの検証
    summary: 想定外の拡張子・MIME・内容のファイルを投入し、保存先・実行可否・スキャンの有無を確認する。
    tools: [Burp Suite, "EICAR テストファイル", 手動]
    outputs: [artifacts/upload-matrix.md, notes.md]
    covers:
      - {id: WSTG-BUSL-08, role: primary}
      - {id: WSTG-BUSL-09, role: primary}
      - {id: WSTG-CONF-03, role: secondary, note: "保存されたファイルの拡張子の扱い"}

  - id: api-graphql-test
    title: API / GraphQL の検証
    summary: スキーマ内省・バッチクエリ・深い入れ子・認可のかかり方を確認する。REST API も同じ枠で扱う。
    tools: [Burp Suite, "GraphQL Voyager", "InQL", curl]
    outputs: [artifacts/graphql-schema.json, artifacts/api-findings.md]
    covers:
      - {id: WSTG-APIT-01, role: primary}
      - {id: WSTG-ATHZ-02, role: secondary, note: "API 側の認可漏れ"}

# === ここから下は scripts/build_coverage.py が自動生成（手で編集しない） ===

by_activity:
  recon-osint:
    primary: [WSTG-INFO-01]
    secondary: [WSTG-CONF-10]
