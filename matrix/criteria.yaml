# プレイブックカードの「判断」部分（手で育てるファイル）
#
# scripts/gen_playbooks.py が WSTG 原文の機械抽出（手順・ツール）と、ここに書いた
# 目的・判定基準をマージして playbooks/WSTG-*.md を生成する。
#
# キー:
#   purpose … 目的（日本語1〜2文）。省略すると原文 Summary の要約が入る。
#   pass    … これなら「問題なし」と言える状態
#   fail    … これが1つでもあれば「指摘」にする状態
#   note    … 補足（新人がつまずく点・誤検知の元）
#   scope   … 前提/スコープを上書きしたいときだけ（Markdown の箇条書きを文字列で）
#   steps   … 具体的な手順（実コマンド・ブラウザ操作）のリスト。省略すると原文
#             How to Test の機械抽出（英語・粗い要約）にフォールバックする。
#             1項目 3〜6 手順・各 1行程度に抑える（カードを小さく保つため）。
#             コマンドは `backtick` で囲む。ホスト名は target 等のプレースホルダにする。
#             ファイルを吐くコマンドは、保存先を `OUTDIR/` で始める。実施記録では
#             new_activity.py がそのエビデンスフォルダの `artifacts/` の実パスに
#             置換する（結果をエビデンスの外に散らかさないため）。カード上は
#             `evidence/<活動フォルダ>/artifacts` と表示される。
#   load_notes … 負荷・レート制限・アカウントロック・DoS を招きうる手順への強調注釈。
#             {手順番号: "注釈"} のマップ（手順番号は steps の 1 始まり）。カードの
#             「## 負荷・レート制限・想定外への注意」と record.html の該当手順に強調表示される。
#             本調査は社内プライベート網が前提だが、想定外（古い機器・共有アカウント・外部 API
#             依存）は起こりうるので、重い/騒がしい/ロックさせる手順には必ず付ける。
#   tools   … 「## 使用ツール」を明示上書きしたいときだけ（リスト）。既定では
#             steps に出てきたツール名を gen_playbooks.py が自動抽出する
#             （TOOL_PATTERNS 参照）。つまり手順で使うツールは手順に書けば載る。
#             手順に出ないツール（GUI 補助など）を足したいときだけ tools を書く。

WSTG-INFO-01:
  purpose: "検索エンジンや公開アーカイブに、対象組織が意図せず晒した情報が残っていないかを確認する。"
  pass: "検索結果に機微情報（資格情報・内部URL・設定ファイル・個人情報）が出てこない。"
  fail: "dork でヒットした結果に、内部ホスト名・エラーメッセージ・認証情報・非公開ドキュメントが含まれる。"
  note: "キャッシュにしか残っていない場合も指摘対象。削除依頼（Search Console 等）まで助言する。theHarvester は -f を付けないと画面と ~/.local/share/theHarvester/stash.sqlite にしか残らない。4.11 は -f のパスを os.path.basename で切ってカレントに書く（サブフォルダ指定は無視）ため、上の手順は生成後に mv で artifacts/ へ移す。crt.sh は API 不調で \"Expected object or value\" が出ることがある（その時はブラウザで https://crt.sh/?q=%25.target.co.jp を確認）。「何も出ない」ことと「スキャンに失敗した」ことは別。ソースごとの成否（例: crtsh の例外）を見て、成功した上で無ければ pass、失敗しているなら再実行する。theHarvester は環境変数（http_proxy/https_proxy）のプロキシを見ない（内部の aiohttp が trust_env を有効にしていない）。プロキシ配下で `-p` を忘れると全ソースが直接通信に失敗し、crtsh は空レスポンスをパースして \"Expected object or value\"、他は黙って0件になる。実測（同一対象・同一ソース）では、`-p` なしは0件で XML 149 バイト、`-p` ありはホストが取れて XML 1249 バイトだった。0件を見たらまず `-p` と proxies.yaml（`http: - <host>:<port>`）を疑う。同じ理由で theHarvester が0件でも crt.sh / hackertarget は curl だと普通に返ることがある（上の疎通確認の手順）。その場合は curl の結果を収集結果として採用し、theHarvester の空 XML/JSON を「情報なし」の根拠にしない。hackertarget は無料枠の日次上限に当たると本文が API count exceeded になる。OTX は匿名アクセス不可なので、使うなら /etc/theHarvester/api-keys.yaml に API キーを入れる。サブドメイン列挙は amass から subfinder に差し替えてある。amass v5 は engine 常駐型で、起動時に bgp.tools を自前のリゾルバ（公開 DNS）で解決するため、外向き UDP/53 が塞がれた環境（プロキシ必須の社内網など）では \"failed to obtain the BGPTools IP address\" で engine が起動せず、enum は 60 秒でタイムアウトする（v5.1.1 の config.yaml にリゾルバ指定は無く、amass engine -h にも -r は無い）。subfinder はこの UDP/53 制約は受けない（HTTPS の API 主体）が、theHarvester と同様に環境変数（http_proxy/https_proxy）を見ないため、プロキシ配下では `-proxy \"$https_proxy\"` を明示しないと全ソースが timeout して0件になる。実測（同一対象）では、`-proxy` なしは0件で約90秒（全ソース timeout）、`-proxy` ありは28件で約32秒だった。それでも取れないときは手順3の crt.sh / hackertarget を採用してよい。record.md にはエラーをそのまま貼り、「<ツール名> はエラーのため未使用」と理由を残す（ツールが動かないことは所見ではない）。"
  steps:
    - "`whois target.co.jp` で組織名・登録者・ネームサーバを確認し、名寄せの起点にする"
    - "`theHarvester -d target.co.jp -b duckduckgo,crtsh,otx,hackertarget -p -f theharvester.xml && mv theharvester.xml theharvester.json OUTDIR/` で露出メール・サブドメイン・ホストを収集（`-p` は /etc/theHarvester/proxies.yaml のプロキシを使う指定。プロキシ不要の環境では外す。4.11 は -f のパスを無視してカレントに .xml/.json を書くので mv で artifacts/ へ移す。`-b all` で全ソース）"
    - "theHarvester が 0 件だったら、各ソースの疎通を単体で確認して「本当に何も無い」のか「収集に失敗した」のかを切り分ける: `curl -s 'https://crt.sh/?q=%25.target.co.jp&output=json' -o OUTDIR/crtsh.json` と `curl -s 'https://api.hackertarget.com/hostsearch/?q=target.co.jp' -o OUTDIR/hackertarget-hosts.txt`。JSON やホスト一覧が返るならソースは生きている＝theHarvester 側の問題なので、この2ファイルを収集結果として採用する（OTX は `https://otx.alienvault.com/api/v1/indicators/domain/target.co.jp/passive_dns` だが匿名アクセス不可で API キーが要る）"
    - "crt.sh（`https://crt.sh/?q=%25.target.co.jp`）と `subfinder -d target.co.jp -all -proxy \"$https_proxy\" -o OUTDIR/subfinder.txt` で公開・失念サブドメインを列挙（`-all` は無料ソースを総当り。subfinder は環境変数のプロキシを見ないので `-proxy` を明示する。プロキシ不要の環境では `-proxy` を外す）"
    - "dork① 業務/設定ファイルの露出: `site:target.co.jp ext:xls OR ext:pdf OR ext:conf` をブラウザで検索（.doc/.docx/.xlsx/.csv/.bak/.sql 等も同様に）。Google と Bing の両方で検索し、結果（件数 or `該当なし`）とスクショを記録する（`did not match any documents` = このdorkでは露出なし＝問題なし）。ヒットがあれば URL・スニペットを artifacts/dorking-hits.md に記録し [creds]/[internal] 等のタグを付ける"
    - "dork② ディレクトリ一覧（オープンディレクトリ）の露出: `intitle:index.of site:target.co.jp` を検索。Google と Bing の両方で検索し、結果（件数 or `該当なし`）とスクショを記録する（`did not match any documents` = このdorkでは露出なし＝問題なし）。ヒットがあれば URL・スニペットを artifacts/dorking-hits.md に記録し [creds]/[internal] 等のタグを付ける"
    - "dork③ 管理画面・管理系パスの露出: `inurl:admin site:target.co.jp` を検索（`login`/`phpmyadmin`/`wp-admin` 等でも同様に）。Google と Bing の両方で検索し、結果（件数 or `該当なし`）とスクショを記録する（`did not match any documents` = このdorkでは露出なし＝問題なし）。ヒットがあれば URL・スニペットを artifacts/dorking-hits.md に記録し [creds]/[internal] 等のタグを付ける"
    - "dork④ エラー/スタックトレースの露出: `site:target.co.jp \"error\" OR \"exception\" OR \"stack trace\"` を検索。Google と Bing の両方で検索し、結果（件数 or `該当なし`）とスクショを記録する（`did not match any documents` = このdorkでは露出なし＝問題なし）。ヒットがあれば URL・スニペットを artifacts/dorking-hits.md に記録し [creds]/[internal] 等のタグを付ける"
    - "dork①〜④の総合判定と過去分の確認: 4本すべて `該当なし` なら dork 観点は pass、1本でも機微なヒットがあれば fail 側の材料。加えて Wayback Machine（web.archive.org）で、今は消えている旧版に①〜④の露出が残っていないか確認する（過去に出ていたものは削除依頼の対象）"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    2: "theHarvester は複数の外部ソースへ一斉に問い合わせる。ソース側のレート制限に当たると 0 件や 429 になる。対象アプリではなく外部サービスへの負荷である点に注意し、失敗時は `-b` を絞って時間を置く。"
    3: "hackertarget は無料枠の日次上限があり、超えると本文が API count exceeded になる。連続実行しない。"
    4: "subfinder -all は多数の外部 API を総当りする。API 上限に達すると取りこぼす（これも対象ではなく外部サービスへの負荷）。"

WSTG-INFO-02:
  purpose: "Web サーバの種類とバージョンがどこまで外部から判別できるかを確認する。"
  pass: "バナー・ヘッダ・エラーページから製品名とバージョンが特定できない、または既知脆弱性のないバージョン。"
  fail: "Server ヘッダ等でバージョンまで特定でき、そのバージョンに既知の脆弱性がある。"
  note: "バージョン秘匿だけでは対策にならない。パッチ状況とセットで報告する。CVE 照合はブラウザ不要で、NVD の REST API を curl で引く（検索キーは CPE 名なので、cpes/2.0 で cpeName を引いてから cves/2.0 に渡す）。whatweb/nmap の表記と NVD の呼称はずれる（nmap の \"Apache httpd 2.4.49\" → cpe:2.3:a:apache:http_server:2.4.49）。cpes/2.0 が 0 件なら製品名を言い換える／バージョンを粗く（2.4.49 → 2.4）して引き直す。CPE が違えば cves/2.0 は当然 0 件になるので、CPE が取れたことを確認するまで「既知脆弱性なし」と書かない。API キー無しは 30 秒 5 リクエストまで（超過は 403）。curl は http_proxy/https_proxy を見るのでプロキシ配下でも追加指定は不要。外向き HTTPS が塞がれた環境では `searchsploit apache 2.4.49`（apt: exploitdb、ローカルDBのみで通信不要）で代替し、その旨を record に書く。"
  steps:
    - "`curl -sI https://target/` で Server / X-Powered-By / Via ヘッダを確認"
    - "`nmap -sV -p80,443 -oN OUTDIR/nmap-http.txt target` と `whatweb --log-json=OUTDIR/whatweb.json https://target/` で製品名・バージョンを突き合わせる"
    - "存在しないパス（`curl -s https://target/nope123`）を叩き、404 ページの体裁からも製品を推定"
    - "手順2 で特定した製品名+バージョンから CPE 名（CVE 照合のキー）を引く: `curl -s --get --data-urlencode \"keywordSearch=apache http server 2.4.49\" https://services.nvd.nist.gov/rest/json/cpes/2.0 -o OUTDIR/nvd-cpe.json` の中身を `jq -r '.totalResults, (.products[].cpe.cpeName)' OUTDIR/nvd-cpe.json` で確認する（keywordSearch は実際に特定した製品名+バージョンに置き換える。0 件なら note の言い換えを試す）"
    - "引いた cpeName で既知 CVE を一覧する: `curl -s 'https://services.nvd.nist.gov/rest/json/cves/2.0?virtualMatchString=cpe:2.3:a:apache:http_server:2.4.49&resultsPerPage=100' -o OUTDIR/nvd-cve.json` → `jq -r '.totalResults' OUTDIR/nvd-cve.json` と `jq -r '.vulnerabilities[].cve | [.id, (.metrics.cvssMetricV31[0].cvssData.baseScore // \"-\" | tostring), .descriptions[0].value[0:100]] | @tsv' OUTDIR/nvd-cve.json`。CVSS 7.0 以上の CVE があれば CVE-ID と「バージョンをどこで特定したか」を finding に書く"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    4: "NVD API は API キー無しだと 30 秒あたり 5 リクエストまで。超えると 403。連続で叩かない（対象ではなく NVD への負荷）。"
    5: "NVD API は API キー無しだと 30 秒あたり 5 リクエストまで。手順4と続けて叩くと 403 になりやすいので間隔を空ける。"

WSTG-INFO-03:
  purpose: "robots.txt・sitemap・security.txt・.well-known 配下から情報が漏れていないかを確認する。"
  pass: "メタファイルに非公開領域のパスや内部情報が書かれていない。"
  fail: "robots.txt の Disallow が管理画面・バックアップ等の場所を教えている、または sitemap に非公開 URL が載っている。"
  note: "Disallow はクロール抑止であってアクセス制御ではない、という説明を必ず添える。"
  steps:
    - "主要な公開ファイルを保存: `curl -s https://target/robots.txt -o OUTDIR/robots.txt; curl -s https://target/sitemap.xml -o OUTDIR/sitemap.xml; curl -s https://target/.well-known/security.txt -o OUTDIR/security.txt`"
    - "`curl -s https://target/.well-known/` 配下、`humans.txt`、`crossdomain.xml` も確認"
    - "robots.txt の Disallow 行が指す領域が認証なしで開くか確認: `grep -i '^Disallow:' OUTDIR/robots.txt | awk '{print $2}' | while read -r pth; do echo \"$pth -> $(curl -s -o /dev/null -w '%{http_code}' https://target$pth)\"; done | tee OUTDIR/robots-disallow-check.txt`。200 が返る行＝認証なしで到達可能なので中身を精査（非公開のはずの領域なら finding）"
    - "sitemap の URL が認証なしで開けるか確認: `grep -oiE '<loc>[^<]+' OUTDIR/sitemap.xml | sed -E 's#</?loc>##gI' | while read -r u; do echo \"$u -> $(curl -s -o /dev/null -w '%{http_code}' \"$u\")\"; done | tee OUTDIR/sitemap-check.txt`。非公開のはずの画面が 200 で列挙されていれば finding"

WSTG-INFO-04:
  purpose: "同一ホスト・同一 IP 上に、対象アプリ以外のアプリや管理系インスタンスが同居していないかを洗い出す。"
  pass: "スコープ内ホストで公開されているアプリが、想定どおりのものだけ。"
  fail: "想定外のアプリ（旧環境・検証環境・別部署のツール・管理コンソール）が同じホストで公開されている。"
  note: "発見物が検査スコープ外なら、攻撃はせず「存在の報告」に留める。"
  steps:
    - "`nmap -sV -p- --open -oN OUTDIR/nmap-allports.txt target` で全ポートのサービスを洗い、Web 以外の管理系ポートも記録（この結果は WSTG-CONF-01・WSTG-CONF-05 でも使い回す。全ポート走査はこの1回だけ）"
    - "同一 IP の他ホストを列挙する。まず証明書透明性ログから既知の名前を拾う（手順は WSTG-INFO-02 の crt.sh 参照）。次にバーチャルホスト総当りで応答するホスト名を洗う: `test -s \"${WSTG_WORDLIST_VHOST:=/usr/share/seclists/Discovery/DNS/subdomains-top1million-5000.txt}\" || { echo \"ワードリストが無い: $WSTG_WORDLIST_VHOST（sudo apt install -y seclists か export WSTG_WORDLIST_VHOST=/path/to/list）\" >&2; exit 2; }; ffuf -w \"$WSTG_WORDLIST_VHOST:FUZZ\" ${WSTG_PAUSE:+-p \"$WSTG_PAUSE\" -t 1} ${https_proxy:+-x \"$https_proxy\"} -u https://target/ -H \"Host: FUZZ.target\" -ac -o OUTDIR/ffuf-vhost.json -of json`。`-ac`（自動キャリブレーション）で既定応答を除外し、残ったホスト名を手順3の材料にする。ワードリストは既定で SecLists の上位 5000 件（`sudo apt install seclists`）。対象に合わせて絞るときは `export WSTG_WORDLIST_VHOST=<パス>`。非力な対象では `export WSTG_PAUSE=2` で待ち＋スレッド1に落とす。ffuf は環境変数のプロキシを見ないので、プロキシ経由なら `-x` を明示する"
    - "見つけたホスト/ポートを OUTDIR/hosts.txt に1行1件で置き（手順1・2 の結果から）、用途判別の材料を一括取得（hosts.txt を置くまで一括実行では「入力待ち」で飛ばす）: `test -s OUTDIR/hosts.txt || exit 75; while read -r hp; do echo \"===== $hp =====\"; curl -s -k -m 8 -D - -o OUTDIR/_body \"https://$hp/\" | grep -iE '^(HTTP/|server:|x-powered-by:|www-authenticate:)'; grep -oiE '<title>[^<]*' OUTDIR/_body | head -1; done < OUTDIR/hosts.txt | tee OUTDIR/vhosts-fingerprint.txt`。取得したタイトル・`Server`・realm と、`dev`/`stg`/`test`/`old`/`admin`/`jenkins`/`grafana`/`phpmyadmin` などのホスト名から用途（検証環境・管理コンソールの疑い）を判別し、各ホストの用途と根拠を artifacts/vhosts.md に1行ずつ書く"
    - "スコープ外のものは攻撃せず「存在の報告」に留め、artifacts に一覧化"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    1: "`nmap -p-` は全 65535 ポートへ接続を試みる重いスキャン。IDS/IPS や機器の接続数上限を刺激しうる。時間帯に注意し、詰まるなら `--max-rate` で抑える。内部網でも想定外の機器（産業機器・古い装置）が落ちることがある。"
    2: "バーチャルホスト総当り（`ffuf -H \"Host: FUZZ\"`）はワードリストの大きさに比例して大量のリクエストを送る。リストを対象に合わせて絞る。"

WSTG-INFO-05:
  purpose: "HTML コメント・JS・メタデータに、開発時の情報が残っていないかを確認する。"
  pass: "コメントや JS に資格情報・内部 IP・未公開エンドポイント・開発メモがない。"
  fail: "ソース中に API キー・パスワード・内部ホスト名・デバッグ用エンドポイントが含まれる。"
  note: "minify 済み JS の source map（.map）も確認する。"
  steps:
    - "トップページの HTML コメントを機械抽出する: `curl -s https://target/ -o OUTDIR/index.html && grep -aoE '<!--.*-->' OUTDIR/index.html | tee OUTDIR/html-comments.txt`。開発メモ・無効化されたリンク・内部パス・認証情報が残っていないか読む（複数行コメントや JS でレンダリングされる DOM 上のコメントは取りこぼすので、主要画面はブラウザの Ctrl+U でも目視する）"
    - "読み込まれる JS を集めて機微語を走査する（手順1で取った index.html の script を辿る）: `grep -oiE 'src=\"[^\"]+\\.js[^\"]*' OUTDIR/index.html | sed -E 's/^src=\"//I' | while read -r j; do case \"$j\" in http*) curl -s \"$j\";; /*) curl -s \"https://target$j\";; *) curl -s \"https://target/$j\";; esac; echo; done > OUTDIR/app-js.txt; grep -inE 'password|passwd|apikey|api[_-]?key|secret|token|bearer|authorization|internal|todo|fixme|debug' OUTDIR/app-js.txt OUTDIR/index.html | tee OUTDIR/js-secrets.txt`。ヒット行は変数名だけの空振りも多いので1つずつ真偽判定し、資格情報・内部 URL は evidence にパス参照で残す"
    - "minify JS の `//# sourceMappingURL` を辿り `.map` を取得、原本コードにコメント/内部情報が無いか見る"
    - "`<meta>`・生成コメント（CMS 名・バージョン）・非公開エンドポイントの記述を記録"

WSTG-INFO-06:
  purpose: "アプリが受け付ける入力点（URL・パラメータ・ヘッダ・Cookie・ファイル）を漏れなく列挙し、以降のテストの土台にする。"
  pass: "入力点の一覧が作成でき、後続テストで参照できる状態になっている（このテスト自体は原則 info/pass）。"
  fail: "認証が必要なはずのエントリポイントに未認証で到達できる等、列挙の過程で明確な問題が見つかった場合。"
  note: "判定より網羅性が目的。認証済み・未認証の両方でクロールしないと漏れる。"
  steps:
    - "Burp のブラウザで匿名・認証済みの両方でアプリを一通り操作し、Proxy→HTTP history に溜める"
    - "history を右クリック→Engagement tools→Analyze target で、URL・パラメータ・ヘッダ・Cookie を列挙"
    - "GET クエリ・POST body・JSON/XML・多段フォーム・隠しフィールド・ファイルアップロード口をすべて表に起こす"
    - "認証状態ごとに到達できる入力点を分け、artifacts/entry-points.md に一覧化（後続テストの土台）"

WSTG-INFO-07:
  purpose: "アプリ内の実行経路（画面遷移・状態遷移）を地図にし、未検査の領域を残さないようにする。"
  pass: "主要な業務フローと分岐が把握でき、テスト対象の網羅率を説明できる。"
  fail: "クロールから漏れる隠し機能・直リンクでしか到達できない画面が見つかり、そこに保護がない。"
  note: "自動クロールだけでは多段フォームや JS 遷移を追えない。手動walkthroughと併用する。"
  steps:
    - "認証済みアカウントでアプリの全機能を手動で歩き（walkthrough）、画面遷移・状態遷移を記録"
    - "Burp の Target→Site map と Content discovery、または ZAP Spider で自動クロールを併用"
    - "多段フォーム・ウィザード・JS 遷移など自動クロールが追えない経路を手動で補完"
    - "業務フロー図（正常系・分岐・キャンセル/戻る）を artifacts に描き、未検査領域を明示"

WSTG-INFO-08:
  purpose: "アプリのフレームワーク・CMS・ライブラリとそのバージョンを特定する。"
  pass: "使用フレームワークが特定できない、または特定できても既知脆弱性のないバージョン。"
  fail: "既知脆弱性のあるバージョンのフレームワーク・ライブラリを使用している（Cookie 名・パス・ヘッダ・JS から特定）。"
  note: "フロント側のライブラリ（jQuery 等）は Retire.js で確認できる。Retire.js は実行時に github から脆弱性DB（jsrepository.json）を取りに行くため、プロキシ必須／外向き通信が絞られた環境では更新に失敗することがある（amass の libpostal と同じ構図）。`--path` は既にダウンロード済みのローカル JS を走査するので、DB さえ取得できれば対象への通信は不要。更新できないときは事前に DB を取得しておくか、下の NVD API での照合に回す。CMS・フレームワーク側の CVE 照合はブラウザ不要で、NVD の cpes/2.0（製品名+バージョン → cpeName）→ cves/2.0（cpeName → CVE 一覧）を curl で引く（API キー無しは 30 秒 5 リクエストまで。0 件の読み替えは WSTG-INFO-02 の note と同じ）。"
  steps:
    - "フレームワーク/CMS は WSTG-INFO-02 手順2 で取得済みの whatweb.json から読む（whatweb を再実行しない）: `jq -r '.[].plugins // {} | keys[]' OUTDIR/whatweb.json | sort -u` ＋ ブラウザ拡張 Wappalyzer で突き合わせる。単独実行で whatweb.json が無いときは先に WSTG-INFO-02 を回す"
    - "応答ヘッダと Cookie を保存して基盤を推定: `curl -sD OUTDIR/headers.txt -o /dev/null https://target/ && { grep -iE '^(set-cookie|x-powered-by|server|x-aspnet-version|x-generator):' OUTDIR/headers.txt || [ $? -eq 1 ]; }`。Cookie 名（`JSESSIONID`=Java / `ASP.NET_SessionId`=.NET / `laravel_session`=Laravel / `ci_session`=CodeIgniter）・`X-Powered-By`・URL パスから基盤を特定"
    - "対象ページが読み込むフロント JS をブラウザ（開発者ツール）や Burp で保存して artifacts/js/ に置き、`test -n \"$(ls -A OUTDIR/js/ 2>/dev/null)\" || exit 75; retire --path OUTDIR/js/ --outputformat json --outputpath OUTDIR/retire.json --exitwith 0`（Retire.js）で走査して jQuery 等ライブラリのバージョンと既知脆弱性を確認する。retire は脆弱性を見つけると既定で exit 13 を返し一括実行が止まるため `--exitwith 0` で抑え、結果は retire.json で判断する。artifacts/js/ が空なら「入力待ち」（exit 75）として一括処理を止めずに飛ばす。JS を置いた後に同じ run_target を再実行するか `uv run scripts/run_activity.py <このフォルダ> --only WSTG-INFO-08:3` で走らせる"
    - "手順1・2 で特定した CMS/フレームワークごとに CPE 名を引く（retire.js が CVE まで出したフロント JS は不要）: `curl -s --get --data-urlencode \"keywordSearch=wordpress 6.4.2\" https://services.nvd.nist.gov/rest/json/cpes/2.0 -o OUTDIR/nvd-cpe-cms.json` → `jq -r '.totalResults, (.products[].cpe.cpeName)' OUTDIR/nvd-cpe-cms.json`"
    - "その cpeName で CVE を一覧し、finding にバージョン根拠（どこで判ったか）を添える: `curl -s 'https://services.nvd.nist.gov/rest/json/cves/2.0?virtualMatchString=cpe:2.3:a:wordpress:wordpress:6.4.2&resultsPerPage=100' -o OUTDIR/nvd-cve-cms.json` → `jq -r '.vulnerabilities[].cve | [.id, (.metrics.cvssMetricV31[0].cvssData.baseScore // \"-\" | tostring), .descriptions[0].value[0:100]] | @tsv' OUTDIR/nvd-cve-cms.json`"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    4: "NVD API はキー無しで 30 秒 5 リクエストまで（超過は 403）。CMS ごとに繰り返すなら間隔を空ける。"
    5: "NVD API はキー無しで 30 秒 5 リクエストまで。手順4と連続で叩かない。"

WSTG-INFO-10:
  purpose: "WAF・LB・リバースプロキシ・API GW・DB など、経路上の構成要素を推定する。"
  pass: "構成が把握でき、防御機構（WAF 等）の有無と位置を説明できる。"
  fail: "本来内部にあるべき構成要素（管理系 API・キャッシュ・DB 管理画面）が外部から直接見えている。"
  note: "構成推定はヒアリングと突き合わせる。推測のまま報告しない。"
  steps:
    - "応答ヘッダを保存して中間装置の印を探す: `curl -sD OUTDIR/resp-headers.txt -o /dev/null https://target/ && { grep -iE '^(via|x-cache|x-served-by|server|set-cookie|x-forwarded-for|cf-ray|x-varnish|x-amz-cf-id):' OUTDIR/resp-headers.txt || [ $? -eq 1 ]; }`。ヒットしたヘッダ（`Via`/`X-Cache`=キャッシュ・LB、`cf-ray`=Cloudflare 等）から中間装置を推定"
    - "経路上のホップを観測: `traceroute -w2 -q1 target | tee OUTDIR/traceroute.txt`（TTL・応答差から CDN/リバースプロキシの位置を推定）。WAF の有無は後続 INPV 系での不正入力への 403/406 で炙り出す"
    - "recon で得たホストを OUTDIR/hosts.txt に1行1件で置き（subfinder.txt 等から）、本来内部向けの装置が外から開いていないか一括確認（hosts.txt を置くまで一括実行では「入力待ち」で飛ばす）: `test -s OUTDIR/hosts.txt || exit 75; while read -r h; do for pp in :9200 :5601 :15672 :8081 :2375 /phpmyadmin/ /adminer/; do echo \"$h$pp -> $(curl -s -k -m 8 -o /dev/null -w '%{http_code}' \"https://$h$pp\")\"; done; done < OUTDIR/hosts.txt | tee OUTDIR/internal-exposure.txt`。200/401 が返る＝外部露出（:9200 Elasticsearch・:5601 Kibana・:15672 RabbitMQ・:8081・:2375 Docker・phpmyadmin/adminer=DB管理）。意図しない露出のみ finding に"
    - "推定した構成図を描き、ヒアリング結果と突き合わせて確定（推測のまま報告しない）"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    3: "多数のホスト×ポートへ順次接続する。ホスト数が多いと接続数と時間がかさみ、内部の装置に想定外の負荷がかかりうる。まず件数を絞って挙動を見る。"

WSTG-CONF-01:
  purpose: "ネットワーク構成として、公開すべきでないサービス・ポート・管理経路が外部に出ていないかを確認する。"
  pass: "公開ポートが業務上必要なものだけで、管理系は接続元制限がかかっている。"
  fail: "SSH・RDP・DB・管理コンソール等が無制限に公開されている、またはサポート切れの製品が動いている。"
  note: "クラウドのセキュリティグループ設定と実際のスキャン結果を突き合わせる。"
  steps:
    - "公開ポート/サービスは enum-apps（WSTG-INFO-04 手順1）の全ポート走査の結果から取り出す（重い全ポート走査を2回しない）: `grep -E '^[0-9]+/(tcp|udp) +open' \"$(ls -1 OUTDIR/../../enum-apps-target-*/artifacts/nmap-allports.txt | tail -1)\" > OUTDIR/open-ports.txt || [ $? -eq 1 ]`。「No such file」で止まったら先に enum-apps を回す（uv run scripts/run_target.py --target target --only enum-apps）。enum-apps を使わず単独で見るときだけ、手で nmap -sV -p- --open を実行して OUTDIR/open-ports.txt に置く"
    - "公開が危険なポート（SSH/RDP/DB/管理系）を手順1のスキャン結果から抽出する（再スキャンせず既存結果を grep するので追加負荷なし）: `grep -E '^(22|23|3389|3306|5432|1433|1521|6379|27017|9200|5601|8080|8443|9000|9090|9990|10000|7001|8161|15672|2375|5900)/(tcp|udp)' OUTDIR/open-ports.txt | tee OUTDIR/sensitive-ports.txt`。1行でも出たら、そのポートが本来アクセスできるべき範囲（社内のみ等）を超えて開いていないか手順4の FW/セキュリティグループ設定と突き合わせる。管理コンソールは製品ごとにポートが違うので、ヒットが無くても手順1の全開放ポート一覧に見慣れないサービスが無いか併せて目視する"
    - "`nikto -h https://target ${WSTG_PAUSE:+-Pause \"$WSTG_PAUSE\"} ${https_proxy:+-useproxy \"$https_proxy\"} -o OUTDIR/nikto.txt` と特定製品の既知脆弱性・既定資格情報を照合。nikto は既定でリクエスト間の待ちが無く、非力な対象は CPU 100%・504 になりやすい。`WSTG_PAUSE`（秒）を設定するとリクエスト間にその秒数だけ空ける（例: `export WSTG_PAUSE=2`。落ちるなら 3〜5 に上げる）。さらに絞るなら `-maxtime 30m` で打ち切り、`-T` で試験カテゴリを限定する。nikto は環境変数のプロキシを見ないので、プロキシ経由で対象に出る環境では `-useproxy` を明示する（`${...:+}` は各変数が設定されているときだけ付く）"
    - "クラウドのセキュリティグループ/FW 設定（ヒアリング）と実スキャン結果を突き合わせ、差分を指摘"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    3: "nikto は既知パスへ大量のリクエストを送る非常に騒がしいスキャン。既定はリクエスト間の待ちが無く、非力な対象は CPU 100%・504 になりやすい。`export WSTG_PAUSE=2`（落ちるなら 3〜5）でリクエスト間に待ちを入れる。さらに `-maxtime` で打ち切り、対象は1つずつ。"

WSTG-CONF-02:
  purpose: "Web サーバ・アプリサーバの既定構成が残っていないかを確認する。"
  pass: "サンプルページ・既定管理画面・不要モジュールが無効化され、ディレクトリリスティングも無効。"
  fail: "既定のサンプルアプリ・テストページ・ディレクトリリスティング・不要な拡張が有効なまま。"
  note: "/server-status, /phpinfo.php, /examples など定番パスを必ず叩く。"
  steps:
    - "定番パスを叩く: `curl -s https://target/{server-status,server-info,phpinfo.php,examples/,manual/,test/}`"
    - "ディレクトリリスティングを確認（`curl -s https://target/images/` 等で index が返るか）"
    - "既定管理画面・サンプルアプリの有無を確認: `for pth in manager manager/html docs examples host-manager admin-console web-console; do echo \"$pth -> $(curl -s -o /dev/null -w '%{http_code}' https://target/$pth/)\"; done | tee OUTDIR/default-apps.txt`。200/401/403 が返るパスは存在（Tomcat `/manager` 等）。既定資格情報の可否は別途確認"
    - "不要機能が有効でないか応答で確認する: `curl -sI -X OPTIONS https://target/` の `Allow` 行に PUT/DELETE/TRACE が並ばないか、`Server`/`X-Powered-By` に余計なモジュール（`mod_status`・PHP等）が出ないか、`?debug=true`・`X-Debug` 系でデバッグ出力（スタック・SQL・変数ダンプ）が返らないか。有効な不要機能を artifacts に列挙し finding に"

WSTG-CONF-03:
  purpose: "拡張子の扱いによって、ソースや設定ファイルの中身が露出しないかを確認する。"
  pass: "実行対象の拡張子は実行され、.inc/.bak/.config 等は配信されない（404/403）。"
  fail: ".php.bak や .asp.old などでソースが平文で取得できる、または想定外の拡張子が実行される。"
  note: "大文字小文字違い・二重拡張子（.php.jpg）も試す。"
  steps:
    - "既知ファイルの拡張子を変えて取得: `curl -s https://target/index.php.bak`（`.old .inc .txt .src ~`）"
    - "設定/ソース拡張子が平文配信されないか一括確認: `for f in web.config app.config config.inc database.sql schema.sql Main.java Program.cs .env config.php.inc; do echo \"$f -> $(curl -s -o /dev/null -w '%{http_code} %{content_type}' https://target/$f)\"; done | tee OUTDIR/source-ext.txt`。200 かつ text/plain 等で中身が返るものは手順1同様に取得し、要約のみ finding に（実物は evidence 参照）"
    - "大文字小文字違い（`.PHP`）・二重拡張子（`.php.jpg`）でハンドラ差が出ないか試す"
    - "取得できたソース/設定は要約のみ finding に、実物は evidence にパス参照で保存"

WSTG-CONF-04:
  purpose: "公開ディレクトリに残った旧版・バックアップ・未参照ファイルを探す。"
  pass: "総当たりでバックアップ・旧版・エディタの一時ファイルが見つからない。"
  fail: ".bak/.old/~/.swp/.zip、リポジトリメタデータ（.git/、.svn/）等が取得できる。"
  note: ".git/config が取れたらリポジトリ全体を復元できる可能性がある。重大度は高く扱う。"
  steps:
    - "`test -s \"${WSTG_WORDLIST_WEB:=/usr/share/seclists/Discovery/Web-Content/common.txt}\" || { echo \"ワードリストが無い: $WSTG_WORDLIST_WEB（sudo apt install -y seclists か export WSTG_WORDLIST_WEB=/path/to/list）\" >&2; exit 2; }; ffuf -w \"$WSTG_WORDLIST_WEB\" ${WSTG_PAUSE:+-p \"$WSTG_PAUSE\" -t 1} ${https_proxy:+-x \"$https_proxy\"} -u https://target/FUZZ -e .bak,.old,.zip,.tar.gz,.swp,~ -o OUTDIR/ffuf-backup.json -of json` で旧版/バックアップを総当り（ワードリストは既定で SecLists の common.txt。`sudo apt install seclists`。絞るときは `export WSTG_WORDLIST_WEB=<パス>`。拡張子6種を掛けるので件数×7 のリクエストになる）。非力な対象では `export WSTG_PAUSE=2` でリクエスト間に待ちを入れ、スレッドも1にして直列化する（既定は 40 並列で対象を飽和させやすい）。ffuf は環境変数のプロキシを見ないので、プロキシ経由なら `-x` を明示する"
    - "既知ファイルの残骸を狙って取得: `for f in login.php.bak .login.php.swp index.php~ config.php.bak .env.bak web.config.old; do echo \"$f -> $(curl -s -o /dev/null -w '%{http_code}' https://target/$f)\"; done | tee OUTDIR/backup-residue.txt`。200 で中身が返るものは取得して evidence に、要約のみ finding に"
    - "リポジトリメタデータ `curl -s https://target/.git/config` `/.svn/entries` を確認（取れたら重大）"
    - "`.git/` が取れる場合は git-dumper 等で復元可否を検証し、重大度・影響範囲を finding に明記"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    1: "ffuf のバックアップ総当りは大量リクエスト。非力な対象は飽和しやすいので `export WSTG_PAUSE=2` で待ち＋スレッド1に落とす（手順のコマンドが対応済み）。ワードリストも対象に合わせて絞る。"

WSTG-CONF-05:
  purpose: "管理インタフェース（インフラ・アプリ両方）の露出と保護状況を確認する。"
  pass: "管理画面が外部から到達できない、または接続元制限＋強い認証（MFA 等）で保護されている。"
  fail: "管理画面が公開ネットワークから到達でき、既定パス・既定資格情報・弱い認証で入れる。"
  note: "パスを秘匿しているだけの状態は fail 寄り。列挙で見つかる時点で保護になっていない。"
  steps:
    - "`test -s \"${WSTG_WORDLIST_WEB:=/usr/share/seclists/Discovery/Web-Content/common.txt}\" || { echo \"ワードリストが無い: $WSTG_WORDLIST_WEB（sudo apt install -y seclists か export WSTG_WORDLIST_WEB=/path/to/list）\" >&2; exit 2; }; ffuf -w \"$WSTG_WORDLIST_WEB\" ${WSTG_PAUSE:+-p \"$WSTG_PAUSE\" -t 1} ${https_proxy:+-x \"$https_proxy\"} -u https://target/FUZZ -o OUTDIR/ffuf-admin.json -of json`（`/admin /manager /wp-admin /phpmyadmin` 等）で管理画面を探索（ワードリストは既定で SecLists の common.txt。管理系パスを含む。`sudo apt install seclists`。差し替えは `export WSTG_WORDLIST_WEB=<パス>`）。非力な対象では `export WSTG_PAUSE=2` で待ちを入れ、スレッドも1にする。ffuf は環境変数のプロキシを見ないので、プロキシ経由なら `-x` を明示する"
    - "インフラ側の管理ポートも確認。enum-apps（WSTG-INFO-04 手順1）の全ポート走査に含まれるので再スキャンせず取り出す: `grep -E '^(8080|8443|9990|10000|7001|8161|9000|9090)/tcp +open' \"$(ls -1 OUTDIR/../../enum-apps-target-*/artifacts/nmap-allports.txt | tail -1)\" > OUTDIR/mgmt-ports.txt || [ $? -eq 1 ]`（空＝該当ポートの公開なし。「No such file」なら先に enum-apps を回す）。open のポートの製品・バージョンを控え、管理コンソールなら手順3の認証確認へ"
    - "見つけた管理画面の認証（既定資格情報・接続元制限・MFA）を確認。既定資格情報は必ず試す"
    - "「パスを秘匿しているだけ」で列挙で出てくる状態は保護不十分として扱う"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    1: "ffuf の管理画面総当りは大量リクエスト。ログイン系パスはアカウントロック・誤検知アラートも誘発しうる。`export WSTG_PAUSE=2` で待ち＋スレッド1に落とし、ログインを含むパスは慎重に。"

WSTG-CONF-06:
  purpose: "サーバが受け付ける HTTP メソッドを列挙し、危険なメソッドや迂回の余地がないかを確認する。"
  pass: "業務上必要なメソッド（GET/POST/HEAD 等）だけが有効で、未定義メソッドは 405 で拒否される。"
  fail: "PUT/DELETE/TRACE/CONNECT が有効、または任意メソッドや X-HTTP-Method-Override で認可を迂回できる。"
  note: "OPTIONS の応答は自己申告にすぎない。実際に各メソッドを投げて確認する。"
  steps:
    - "`curl -sX OPTIONS https://target/ -i` で Allow ヘッダを確認（自己申告なので鵜呑みにしない）"
    - "各メソッドを投げて応答コードを記録: `for m in OPTIONS TRACE PUT DELETE PATCH CONNECT; do echo \"$m -> $(curl -s -o /dev/null -w '%{http_code}' -X $m https://target/)\"; done | tee OUTDIR/http-methods.txt`。405/501 は拒否、200/204 で通るメソッド（特に PUT/DELETE/TRACE）は挙動を手順3で精査"
    - "`PUT` でファイル設置、`TRACE` で XST、任意メソッドで認可迂回ができないか検証"
    - "`X-HTTP-Method-Override: DELETE` 等のヘッダで本来拒否されるメソッドに化けられないか試す"

WSTG-CONF-07:
  purpose: "HSTS の設定により、平文通信へのダウングレードを防いでいるかを確認する。"
  pass: "HTTPS 応答に Strict-Transport-Security があり、max-age が十分（半年以上）で includeSubDomains 付き。"
  fail: "HSTS ヘッダがない、max-age が極端に短い、または HTTP でしか提供していない画面がある。"
  note: "HSTS は HTTPS 応答でのみ有効。HTTP 側に付けても意味がないことを説明する。"
  steps:
    - "`curl -sD OUTDIR/root-headers.txt -o /dev/null https://target/` で応答ヘッダを保存し（この後の手順・WSTG-CLNT-09 でも使い回す）、`grep -i '^strict-transport-security:' OUTDIR/root-headers.txt || [ $? -eq 1 ]` で HSTS の有無・値を確認（何も出なければ HSTS なし＝fail 候補。grep の「一致なし」は失敗扱いにしない）"
    - "`max-age`（半年=15768000 以上が目安）・`includeSubDomains`・`preload` の各ディレクティブを確認"
    - "`curl -sI http://target/` で HTTP アクセス時の挙動（HTTPS へ 301 されるか）を確認"
    - "HTTP 応答に HSTS を付けても無効な点を踏まえ、HTTPS 応答での設定を評価"

WSTG-CONF-08:
  purpose: "crossdomain.xml / clientaccesspolicy.xml による過剰なクロスドメイン許可がないかを確認する。"
  pass: "これらのポリシーファイルが存在しない、または許可ドメインが必要最小限。"
  fail: "allow-access-from domain=\"*\" のようなワイルドカード許可がある。"
  note: "Flash は終息済みだが、ファイルが残っていると他クライアントが参照する場合がある。"
  steps:
    - "クロスドメインポリシーを取得: `for f in crossdomain.xml clientaccesspolicy.xml; do echo \"===== $f =====\"; curl -s -w '\\n[status %{http_code} type %{content_type}]\\n' https://target/$f; done | tee OUTDIR/crossdomain.txt`"
    - "`allow-access-from domain=\"*\"` などワイルドカード許可になっていないか確認"
    - "`secure=\"false\"` や過度に広い許可ドメインが指定されていないか見る"
    - "該当ファイルが存在しない/最小限なら pass、緩い許可があれば影響を finding に記載"

WSTG-CONF-09:
  purpose: "ファイル・ディレクトリの権限設定が過剰でないかを確認する（ホスト側の確認が前提）。"
  pass: "設定ファイル・鍵・ログが必要最小限のユーザだけに読み書き可能。"
  fail: "設定ファイルや秘密鍵が全ユーザ読み取り可、Web 公開ディレクトリが書き込み可等。"
  note: "リモートからは判定できない。ホスト側の情報提供が得られない場合は na とし、その旨を書く。"
  steps:
    - "対象サーバに手が届く場合、`ls -la` / `icacls` で Web ルート・設定ファイルの権限を確認"
    - "手順1の `ls -la` 出力で、設定ファイル・秘密鍵・ログのパーミッションを見る。危険な例: その他ユーザ読取可（`----r--` の others r、例 `-rw-r--r--` の `.env`/`*.key`/`config.php`）、Web実行ユーザ（www-data等）が所有 or 書込可な設定ファイル（改ざん・Webshell設置につながる）。該当ファイルとモード（例 `644 config.php owner=www-data`）を artifacts に控える"
    - "アップロード保存先ディレクトリ（`uploads/` 等）に実行権が付いていないか見る: `ls -la` でディレクトリ/ファイルに `x`（例 `-rwxr-xr-x` の *.php）が無いか、Web からそのパスのスクリプトが実行されないか（`curl` で設置した無害ファイルが text で返るか実行されるか）。実行可能なら Webshell 設置リスクとして finding に"
    - "この項目はサーバ内部権限が前提。外部からのみの検査時は情報不足として na/ヒアリング扱い"

WSTG-CONF-10:
  purpose: "宙に浮いた DNS レコードにより、第三者がサブドメインを乗っ取れないかを確認する。"
  pass: "全サブドメインの向き先が実在し、解放済みクラウドリソースを指す CNAME がない。"
  fail: "解放済みのホスティング先を指す CNAME/A があり、第三者が同名リソースを取得して掌握できる。"
  note: "実際の乗っ取りは行わない。到達性とエラー応答（NoSuchBucket 等）で判断し、証拠として記録する。"
  steps:
    - "サブドメインの各 CNAME をまとめて引く。recon-osint（WSTG-INFO-01 手順4）で作った subfinder.txt を OUTDIR/subfinder.txt にコピーして入力に（置くまで一括実行では「入力待ち」で飛ばす） `test -s OUTDIR/subfinder.txt || exit 75; while read -r h; do echo \"$h -> $(dig +short CNAME $h | head -1)\"; done < OUTDIR/subfinder.txt | tee OUTDIR/cname-check.txt` を実行する（`->` の右が埋まっている行＝CNAME を持つサブドメインが乗っ取り確認の対象。空欄は A/AAAA 直指定なので対象外。crt.sh で拾った分も subfinder.txt に足してから回す）"
    - "cname-check.txt を乗っ取り可能サービスの CNAME フィンガープリントで絞り込む: `grep -iaE \"s3[.-]|\\.s3\\.amazonaws|\\.github\\.io|heroku(dns|app)|\\.azurewebsites\\.net|\\.cloudfront\\.net|\\.fastly\\.net|pantheonsite|\\.ghost\\.io\" OUTDIR/cname-check.txt | tee OUTDIR/takeover-candidates.md`。ヒットした行（`サブドメイン -> CNAME`）が要確認。出力が空なら該当なし＝この時点で pass 相当（対象サービス: S3 / GitHub Pages / Heroku / Azure / CloudFront / Fastly / Pantheon / Ghost 等。漏れが心配なら OUTDIR/cname-check.txt 全体も目視する）"
    - "要確認リストの各サブドメインの応答をまとめて取得する: `while read -r line; do h=${line%% *}; echo \"===== $h =====\"; curl -s -m 10 https://$h/ | head -c 800; echo; done < OUTDIR/takeover-candidates.md | tee OUTDIR/takeover-responses.txt`。各応答に、サービス既定の「リソースが存在しない」エラーが出ているか見る。乗っ取り可能な典型応答: S3=`NoSuchBucket`、GitHub Pages=`There isn\u2019t a GitHub Pages site here`、Heroku=`No such app`、Azure=`404 Web Site not found`、Fastly=`Fastly error: unknown domain`。このエラーが出る＝第三者が同名リソースを登録して掌握できる状態（fail）。正常なコンテンツが返る＝実在リソース（この観点は pass）"
    - "乗っ取り可能と判断しても、実際の取得（バケット作成・リポジトリ/アプリ登録等）は行わない。CNAME・エラー応答本体・ステータスを証跡（artifacts/）に残し、finding には該当サブドメイン名と「どのサービスの未登録リソースを指すか」を要約で書く（生の CNAME 先ホスト名は evidence 参照に留める）"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    3: "確認対象の各サブドメインへ順に HTTP 接続する。件数が多いと外部サービス（乗っ取り確認先）への負荷になる。"

WSTG-CONF-11:
  purpose: "クラウドストレージの公開設定が過剰でないかを確認する。"
  pass: "バケット・コンテナが匿名アクセス不可、または公開すべきファイルのみ公開。"
  fail: "一覧取得や任意ファイル取得が匿名でできる、または書き込みができる。"
  note: "書き込み可否の確認は影響が大きい。実施前に許可範囲を確認し、無害なファイル名で検証する。"
  steps:
    - "アプリが参照するストレージ URL を、metafiles-crawl（WSTG-INFO-05 手順1/2）が取得済みの index.html・app-js.txt から抽出する（同じ全 JS クロールを繰り返さない）: `grep -rhoiE 'https?://[A-Za-z0-9._-]+\\.(s3[A-Za-z0-9.-]*\\.amazonaws\\.com|s3\\.amazonaws\\.com|blob\\.core\\.windows\\.net|storage\\.googleapis\\.com)[A-Za-z0-9._~:/?#@!$&*+,;=%-]*' \"$(ls -1d OUTDIR/../../metafiles-crawl-target-*/artifacts | tail -1)\"/index.html \"$(ls -1d OUTDIR/../../metafiles-crawl-target-*/artifacts | tail -1)\"/app-js.txt > OUTDIR/storage-urls.txt; rc=$?; [ $rc -le 1 ] || exit $rc; sort -u -o OUTDIR/storage-urls.txt OUTDIR/storage-urls.txt`。「No such file」で止まったら先に metafiles-crawl を回す（uv run scripts/run_target.py --target target --only metafiles-crawl）。動的生成 URL は取りこぼすので、SPA では Burp/ZAP のサイトマップで補う"
    - "抽出した各ストレージのホストルートに匿名アクセスできるか確認: `while read -r u; do b=$(echo \"$u\" | sed -E 's#(https?://[^/]+).*#\\1/#'); echo \"===== $b =====\"; curl -s -m 10 -o /dev/null -w 'code %{http_code}\\n' \"$b\"; curl -s -m 10 \"$b\" | head -c 300; echo; done < OUTDIR/storage-urls.txt | tee OUTDIR/storage-anon.txt`。`ListBucketResult`/ディレクトリ一覧が返る、または 200 で中身が見えるものは匿名読取可"
    - "S3 ホスト名からバケット名を割り出し、匿名で一覧できるか確認: `grep -oiE '[a-z0-9.-]+\\.s3[a-z0-9.-]*\\.amazonaws\\.com' OUTDIR/storage-urls.txt | sed -E 's#\\.s3.*##' | sort -u | while read -r b; do echo \"===== $b =====\"; aws s3 ls --no-sign-request \"s3://$b\" 2>&1 | head -20; done | tee OUTDIR/s3-list.txt`。書き込み可否（`aws s3 cp` 相当）は破壊的になり得るので、許可範囲を確認してから手動で試す"
    - "公開が業務上意図されたものか切り分け、意図しない公開のみ finding にする"

WSTG-IDNT-01:
  purpose: "ロール定義が文書化され、実装と一致しているかを確認する。"
  pass: "ロールと権限の一覧があり、実機の挙動と齟齬がない。"
  fail: "定義が存在しない、または定義と実装が食い違う（実際には上位権限が使えるロールがある）。"
  note: "後続の authz-matrix の土台になる。ここが曖昧だと権限テストが評価できない。"
  steps:
    - "各ロール（管理者・一般・ゲスト等）ごとに Burp でセッションを分けてログインし、使える機能・見える画面を表に起こす"
    - "ロール定義のドキュメント/ヒアリング内容と、実際の権限が一致するか突き合わせる"
    - "Burp の Autorize 拡張でロール間の機能・データの重なりや、想定外に強い既定権限がないか確認"
    - "この結果は ATHZ 系（認可）テストの入力になるので artifacts/role-matrix.md に整理"

WSTG-IDNT-02:
  purpose: "利用者登録プロセスに、なりすましや権限の不正取得の余地がないかを確認する。"
  pass: "本人確認・承認の手順があり、登録だけで特権を得られない。"
  fail: "誰でも自己登録で特権ロールを取得できる、同一人物が複数アカウントを無制限に作れる等。"
  note: "業務上の許容範囲は顧客の運用次第。仕様と照らして判断する。"
  steps:
    - "登録フォームを Burp で捕捉し、同一メール/ユーザ名で二重登録できるか試す"
    - "登録に必要な検証（メール確認・管理者承認）を省略して自己登録できないか確認"
    - "ロール指定パラメータ（`role=admin` 等）を Burp Repeater で登録リクエストに追加し、権限昇格して登録できないか試す"
    - "使い捨てメール・大量自動登録への対策（CAPTCHA・レート制限）の有無を確認"

WSTG-IDNT-03:
  purpose: "アカウント払い出し・停止・削除の運用が適切かを確認する。"
  pass: "払い出しに承認があり、退職・異動時の停止手順が定義・実行されている。"
  fail: "管理者が承認なくアカウントを作成できる、退職者アカウントが有効なまま残る。"
  note: "実機よりヒアリングと証跡（申請記録）で判断する項目。"
  steps:
    - "アカウント発行フロー（誰が・どの経路で作れるか）を確認し、承認なしで作れないか検証"
    - "退職・解約時の失効フローと、失効後も Burp で当該セッション/トークンを再送してログインできないか確認"
    - "低権限ユーザが自分/他人のアカウントを作成・昇格できないか試す"
    - "発行〜失効のライフサイクルの穴を finding に整理（実装より運用の観点で）"

WSTG-IDNT-04:
  purpose: "ログイン・登録・リセットの応答差から、有効なユーザ名を推測できないかを確認する。"
  pass: "存在するユーザと存在しないユーザで、メッセージ・ステータス・応答時間に有意差がない。"
  fail: "「パスワードが違います」「該当ユーザなし」等でユーザの存在が判別できる、または応答時間に差がある。"
  note: "応答時間差はハッシュ計算の有無で出やすい。数十回計測して平均で比較する。"
  steps:
    - "ログイン失敗メッセージの差（「該当ユーザなし」vs「パスワード誤り」）を Burp Repeater で比較"
    - "パスワードリセット・登録・ログインの各画面で、存在/非存在ユーザの応答差・応答時間差を確認"
    - "存在するユーザ名の列挙が可能か（連番 ID・メール総当り）を少量で検証"
    - "差分が出る箇所を全て挙げ、応答本文・ステータス・時間のどれで判別できるか finding に記す"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    3: "ユーザ名列挙の総当りは大量リクエストに加えロックの恐れがある。手順の「少量で」を厳守し、挙動確認に留める。"

WSTG-IDNT-05:
  purpose: "ユーザ名のポリシーが推測を助長していないかを確認する。"
  pass: "ユーザ名が推測しにくい、または推測できても他の対策（MFA・ロックアウト）で守られている。"
  fail: "社員番号やメールの規則的な組み合わせで有効アカウントを大量に作れる、かつ列挙も可能。"
  note: "IDNT-04 とセットで報告すると影響が伝わりやすい。"
  steps:
    - "登録時にユーザ名の形式（メール必須か・記号可否・長さ）と一意性の扱いを確認"
    - "推測しやすい命名規則（社員番号・`名.姓`）が強制/露出されていないか確認"
    - "大文字小文字・前後空白・同形異字で別ユーザを作れる（なりすまし余地）か Burp Repeater で試す"
    - "列挙容易性（IDNT-04）と合わせ、ユーザ名ポリシーの弱さを finding に整理"

WSTG-ATHN-01:
  purpose: "資格情報が暗号化された経路でのみ送信されているかを確認する。"
  pass: "ログイン画面と送信先の両方が HTTPS で、HTTP へのフォールバックがない。"
  fail: "資格情報が HTTP で送信される、HTTPS 画面から HTTP へ POST している、または GET のクエリに載っている。"
  note: "リダイレクト前の最初のリクエストが平文になっていないかも確認する。"
  steps:
    - "ログイン画面を HTTP で開けるか試す: `curl -s http://target/login`（HTTPS 強制か確認）"
    - "Burp で認証情報送信リクエストを捕捉し、送信先が https で POST body に載っている（GET/URL でない）か確認"
    - "HTTPS 画面から HTTP エンドポイントへ資格情報を投げていないか、リダイレクト前の初回リクエストも確認"
    - "ログイン後の各機能でも平文チャネルへ資格情報が漏れないか history を見る"

WSTG-ATHN-02:
  purpose: "既定の資格情報や推測しやすいアカウントが残っていないかを確認する。"
  pass: "既定アカウントが削除・無効化・パスワード変更済み。"
  fail: "admin/admin 等の既定資格情報でログインできる、または製品既定アカウントが有効。"
  note: "総当たりではなく「製品既定値の確認」に留める。試行回数は事前合意の範囲で。"
  steps:
    - "既定資格情報（`admin/admin`・ベンダ既定）を管理画面・アプリログインで試す（まとめて試すなら `hydra` や Burp Intruder）"
    - "既定ユーザ名の列挙（`admin`/`root`/`test`/`guest`）と、初期パスワード未変更を確認"
    - "インストーラ・セットアップ画面が残り、無認証でアクセスできないか確認"
    - "成功した組合せは要約のみ finding に、実際の資格情報は evidence にパス参照で残す"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    1: "既定資格情報を hydra / Intruder でまとめて試すとアカウントロックを誘発する。まず1つずつ手で試し、ロック閾値を把握してから。専用のテストアカウントで。"

WSTG-ATHN-03:
  purpose: "総当たり攻撃に対するロックアウト等の抑止が機能しているかを確認する。"
  pass: "一定回数の失敗でロックまたは段階的遅延・CAPTCHA が働き、自動化が現実的でない。"
  fail: "失敗回数に制限がなく、高速な総当たりが可能。"
  note: "ロックアウトは DoS にもなる。解除条件（時間経過か管理者解除か）まで記録する。"
  steps:
    - "同一アカウントに誤ったパスワードで連続ログイン（Burp Intruder / `hydra`）し、ロックされる閾値を確認（少数から）"
    - "ロック後の解除方法（時間経過・管理者解除）と、ロック中の応答差を確認"
    - "ロックがユーザ名基準か IP 基準か、API/別チャネルで回避できないか確認"
    - "ロックアウトがないか極端に緩い場合は総当りリスクとして finding に。DoS を招く強すぎる設定も併記"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    1: "これは意図的にロックさせるテスト。本番アカウントや共有アカウントでやると実利用者を締め出す。必ず専用のテストアカウントで、少数から段階的に。"

WSTG-ATHN-04:
  purpose: "認証を経ずに保護対象へ到達できる経路がないかを確認する。"
  pass: "保護対象 URL に未認証で直接アクセスするとすべて弾かれる。"
  fail: "直リンク・パラメータ改変（isAdmin=true 等）・SQL インジェクション・セッション改変で認証を迂回できる。"
  note: "「リダイレクトされるが本文も返ってきている」パターンを見落とさない。本文の中身を確認する。"
  steps:
    - "認証必須ページに直 URL でアクセス（force browsing）し、未認証で開けないか確認"
    - "ログイン後にセットされる Cookie/パラメータ（`isAuth=false`→`true` 等）を Burp で改変して迂回を試す"
    - "SQL インジェクション（`' or '1'='1`）・パラメータ改変・レスポンス改変（302→200）で認証を飛ばせるか試す"
    - "多段認証の途中ステップを飛ばして最終ページに到達できないか確認"

WSTG-ATHN-05:
  purpose: "ログイン保持機能が資格情報を危険な形で保存・送信していないかを確認する。"
  pass: "保持用トークンがランダムで有効期限があり、失効操作で無効化される。"
  fail: "パスワードやその可逆な形が Cookie・localStorage に保存される、またはトークンが失効しない。"
  note: "ログアウト後・パスワード変更後にトークンが無効になるかを必ず試す。"
  steps:
    - "「パスワードを記憶」利用時に、資格情報が Cookie/localStorage に平文/可逆で保存されないかブラウザ開発者ツールで確認"
    - "記憶トークンを Burp で確認し、推測可能・無期限・失効しない（ログアウト後も有効）でないか確認"
    - "ブラウザのオートコンプリート（フォームの `autocomplete` 属性）で機微入力が保存されないか確認"
    - "記憶用トークンから元パスワードやセッションが復元できないか検証"

WSTG-ATHN-06:
  purpose: "認証済み画面がブラウザキャッシュに残り、後から閲覧されないかを確認する。"
  pass: "機微画面の応答に Cache-Control: no-store（必要なら no-cache, must-revalidate）が付いている。"
  fail: "認証後の画面がキャッシュされ、ログアウト後に戻るボタンや履歴から内容を再表示できる。"
  note: "実機で「ログアウト→戻る」を試すのが最も伝わる証拠になる。"
  steps:
    - "認証済みの機微画面 URL を OUTDIR/auth-urls.txt に1行1件で置き、ログイン後の Cookie を OUTDIR/cookies.txt に用意（ブラウザからエクスポート、または curl -c で保存）した上で、キャッシュ抑止ヘッダを一括確認（2つが揃うまで一括実行では「入力待ち」で飛ばす）: `test -s OUTDIR/auth-urls.txt -a -s OUTDIR/cookies.txt || exit 75; while read -r u; do echo \"== $u ==\"; curl -sI -b OUTDIR/cookies.txt \"$u\" | grep -iE '^(cache-control|pragma|expires):'; done < OUTDIR/auth-urls.txt | tee OUTDIR/cache-headers.txt`。`no-store`（理想）/`no-cache`/`private` が無い・`max-age>0`＝ディスクにキャッシュされ得る"
    - "ログアウト後にブラウザの「戻る」で認証済み画面が再表示されないか確認"
    - "機微画面をディスクキャッシュから復元できないか確認する: 認証済みで機微画面を開いた後、DevTools→Network で当該レスポンスを再読込し `(from disk cache)` と出るか、または about:cache（Firefox）/ ブラウザのキャッシュ保存先に当該 URL のエントリが残るか。残る＝ログアウトや別ユーザでもディスクから中身を復元され得る（共用端末で漏えい）"
    - "機微画面でキャッシュ抑止がない場合、共用端末での漏えいリスクとして finding に"

WSTG-ATHN-07:
  purpose: "パスワードポリシーが十分な強度を要求しているかを確認する。"
  pass: "最低長（12文字以上が目安）と使い回し・既知漏えいパスワードの抑止があり、上限が極端に短くない。"
  fail: "4〜6文字や辞書語が通る、最大長が短すぎる、文字種強制のみで長さを要求していない。"
  note: "現行 NIST SP 800-63B は「長さ重視・複雑さ強制は不要・漏えいリスト照合」を推奨。"
  steps:
    - "パスワード変更/登録で短い・単純な値（`1234`・`password`・辞書語）が通るか Burp Repeater で試す"
    - "最小長・文字種・使い回し/過去パスワード禁止・よくあるパスワード拒否の有無を確認"
    - "最大長制限が短すぎ（例: 16 未満）でパスフレーズが使えないか確認"
    - "強度要件を満たさない値が実際に登録できた場合は finding に（画面表記でなく実挙動で判定）"

WSTG-ATHN-08:
  purpose: "秘密の質問が認証手段として弱すぎないかを確認する。"
  pass: "秘密の質問を単独の認証手段として使っていない。"
  fail: "公開情報から推測できる質問（出身校・母親の旧姓）だけでパスワードリセットができる。"
  note: "質問の変更・回答の使い回し可否も確認する。"
  steps:
    - "秘密の質問の選択肢が、SNS 等から推測/調査可能な内容（出身地・母の旧姓）でないか確認"
    - "質問への回答試行を Burp Intruder で繰り返し、レート制限・ロックがあるか確認"
    - "質問だけでパスワードリセットまで到達できる（多要素でない）弱いフローでないか確認"
    - "自由記述質問で任意の弱い質問を設定できないか確認"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    2: "秘密の質問の総当りはアカウントロックやリセットフロー濫用を招く。テストアカウントで少数から。"

WSTG-ATHN-09:
  purpose: "パスワード変更・リセット機能に、他人のパスワードを変更できる欠陥がないかを確認する。"
  pass: "変更時に現行パスワードを要求し、リセットトークンは十分ランダム・短寿命・単回使用。"
  fail: "現行パスワードなしで変更できる、トークンが推測可能・再利用可能、他人の ID を指定してリセットできる。"
  note: "リセット完了時に既存セッションが無効化されるかも確認する。"
  steps:
    - "パスワード変更に現行パスワードが必要か確認（不要なら CSRF/セッション奪取で悪用可）"
    - "リセットのトークンが推測可能・長期有効・使い回し可能でないか確認"
    - "リセットリンクの送信先を Burp で `email` パラメータ差し替えして他人宛に送れないか試す"
    - "変更/リセット後に既存セッションが無効化されるか確認"

WSTG-ATHN-10:
  purpose: "モバイル・API・SSO など代替チャネルの認証が、本流より弱くなっていないかを確認する。"
  pass: "すべてのチャネルで同等の認証強度・ロックアウト・MFA が適用される。"
  fail: "API やモバイル用エンドポイントだけロックアウトや MFA がない、旧版エンドポイントが残っている。"
  note: "代替チャネルの洗い出しは recon と burp-crawl の成果を使う。"
  steps:
    - "モバイルアプリ・API・IVR 等の代替チャネルで、Web と同等のロックアウト/MFA/強度要件があるか確認"
    - "旧版/別系統の API ログイン口が生きていないか一括プローブ: `for e in /api/v1/login /api/v2/login /api/login /rest/login /login.json /oauth/token /mobile/login; do echo \"$e -> $(curl -s -k -m 8 -o /dev/null -w '%{http_code}' -X POST \"https://target$e\")\"; done | tee OUTDIR/legacy-api.txt`。200/400/401 が返る＝存在。応答を精査し、MFA/ロックアウトが無い・平文許容など弱い認証が残っていないか確認"
    - "チャネル間でセッション/トークンが共有され、弱い側から強い側を侵害できないか確認"
    - "代替チャネルだけ保護が抜けている箇所を finding に整理"

WSTG-ATHZ-01:
  purpose: "パス・ファイル名を扱う機能で、意図しないファイルを読めないかを確認する。"
  pass: "パス文字列がホワイトリスト等で正規化・検証され、範囲外を指定すると拒否される。"
  fail: "../ や絶対パス、エンコード変種（%2e%2e/）で範囲外のファイルを読める・インクルードできる。"
  note: "読み出せた事実だけを記録し、機微ファイルの中身は必要最小限にとどめる。"
  steps:
    - "ファイル参照パラメータ（`?file=`,`?page=`,`?lang=`）に `../../etc/passwd`・`..\\..\\` を Burp Repeater で入れて範囲外読取を試す"
    - "エンコード変種（`%2e%2e%2f`・二重エンコード `%252e`・`....//`）で WAF/フィルタを迂回できるか `dotdotpwn` 等で試す"
    - "絶対パス指定・null バイト・拡張子付与（`file=../../etc/passwd%00.png`）も試す"
    - "LFI で設定ファイル/ソースが読める、または include で任意ファイルを実行できるか確認"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    2: "dotdotpwn は多数のパストラバーサル変種を送る。WAF の遮断や大量のエラーログを生む。"

WSTG-ATHZ-02:
  purpose: "認可チェックを回避して他ロールの機能・データにアクセスできないかを確認する。"
  pass: "低権限ロールで高権限のリクエストを再送すると、すべて 401/403 になる。"
  fail: "低権限や未認証で管理系リクエストが成功する（画面が出ない＝保護されている、ではない）。"
  note: "表示制御のみで API 側の認可がないパターンが最頻出。必ずリクエスト単位で試す。"
  steps:
    - "低権限アカウントで、高権限用の URL/機能に直接アクセス（force browsing）できるか確認"
    - "Burp で高権限操作のリクエストを捕捉し、低権限セッションの Cookie に差し替えて再送（横移動/縦移動）"
    - "UI上は非表示/無効の機能（管理メニュー・ボタン・タブ）でも、その裏のエンドポイントを低権限セッションで直接叩くと実行できてしまわないか確認する。HTMLソース・JS・API定義から管理用URL/APIパスを拾い、Burp Repeaterで低権限Cookieのまま送る。通る＝サーバ側で認可しておらずクライアント任せ（＝保護不十分）"
    - "未認証でも保護リソースに到達できないか、Cookie を外して再送し確認"

WSTG-ATHZ-03:
  purpose: "自分より高い権限へ昇格できないかを確認する。"
  pass: "ロール・権限を示す値を改変しても、サーバ側で拒否される。"
  fail: "パラメータ・JWT クレーム・Cookie の改変や、権限付与 API の直接呼び出しで昇格できる。"
  note: "水平（他ユーザ）と垂直（上位権限）を分けて記録すると報告が明確になる。"
  steps:
    - "低権限アカウントで、ロールを示すパラメータ/Cookie/JWT クレーム（`role`,`isAdmin`,`group`）を管理者値に改変し Burp Repeater で再送"
    - "管理者専用機能のリクエストを低権限セッションで再送し、実行できるか確認"
    - "多段承認・所有者チェックを飛ばして他ユーザ資源を操作できないか試す"
    - "水平（同ロール他人）・垂直（上位ロール）の両方向で昇格を検証"

WSTG-ATHZ-04:
  purpose: "識別子を差し替えて他人のデータにアクセスできないか（IDOR）を確認する。"
  pass: "識別子を他ユーザのものに変えると 403/404 になり、所有者チェックが効いている。"
  fail: "連番 ID や UUID の差し替えで他ユーザのデータを閲覧・更新・削除できる。"
  note: "参照だけでなく更新・削除系も試す。テストデータ同士で行い、実データは触らない。"
  steps:
    - "オブジェクト参照パラメータ（`?id=1001`,`/orders/1001`,ファイル名）を他人の値に変えて開けるか Burp で試す"
    - "連番・UUID・base64/ハッシュ ID を Burp Intruder で推測/列挙し、他人の資源にアクセスできるか確認"
    - "参照方法を変えても（GET/POST/JSON body/multipart）認可チェックが一貫しているか確認"
    - "自分の ID でのみアクセスできるべき資源に他 ID で到達できたら IDOR として finding に"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    2: "Intruder による ID 列挙は大量リクエストに加え、他人の資源への実アクセスを伴う。件数を絞り、取得データは要約のみを finding に。"

WSTG-SESS-01:
  purpose: "セッション管理方式（トークンの生成・保管・検証）が健全かを確認する。"
  pass: "トークンが十分ランダムで予測不能、サーバ側で失効管理され、識別子として推測できない。"
  fail: "トークンが連番・時刻由来・ユーザ情報のエンコードなどで予測可能、または改ざん検知がない。"
  note: "Burp Sequencer 等でランダム性を測り、サンプルは artifacts に保存する。"
  steps:
    - "ログインで発行されるセッション ID を Burp で捕捉し、長さ・文字種・予測可能性を確認"
    - "Burp Sequencer で多数のトークンを収集し、ランダム性（エントロピー）を測定"
    - "セッション ID が URL に載る・JS から読める・複数同時ログインを許すか確認"
    - "ログイン/権限変更時に ID が再発行されるか（固定でないか）確認。サンプルは artifacts に保存"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    2: "Burp Sequencer は統計に足る数（数千〜）のトークンを集めるため、大量のセッション発行リクエストを送る。セッションテーブルやログを圧迫しうる。"

WSTG-SESS-02:
  purpose: "セッション Cookie の属性が適切に設定されているかを確認する。"
  pass: "Secure・HttpOnly が付き、SameSite が Lax 以上、Domain/Path が必要最小限。"
  fail: "Secure か HttpOnly が欠けている、SameSite=None なのに用途上不要、Domain が広すぎる。"
  note: "認証済みで発行される Cookie を対象にする。トラッキング用 Cookie と混同しない。"
  steps:
    - "ログイン応答のヘッダを OUTDIR/login-headers.txt に保存（curl -i -c OUTDIR/cookies.txt でログインを実行してヘッダを残すか、Burp/DevTools の応答からコピー）した上で、発行 Cookie の属性を抽出: `test -s OUTDIR/login-headers.txt || exit 75; grep -iE '^set-cookie:' OUTDIR/login-headers.txt || [ $? -eq 1 ]`（保存前に一括実行すると「入力待ち」で飛ばし、保存後の再実行で走る）。出てきた Set-Cookie 行を1つずつ下の属性で確認する"
    - "手順1で保存した Set-Cookie の属性欠落を自動抽出する: `grep -iE '^set-cookie:' OUTDIR/login-headers.txt | while read -r c; do for a in Secure HttpOnly SameSite; do echo \"$c\" | grep -qi \"$a\" || echo \"[要確認] $a なし: $(echo \"$c\" | cut -c1-70)\"; done; done | tee OUTDIR/cookie-attrs.txt`。出力が空＝全 Cookie に3属性あり。行が出たセッション/認証系 Cookie は `Secure`（HTTPS 限定）・`HttpOnly`（JS 遮断）・`SameSite`（Lax/Strict）のいずれかが欠けている（CSRF/その他の非機微 Cookie は SameSite 無しでも許容の場合があるので finding では Cookie 名で区別する）"
    - "`Domain`/`Path` が過度に広くないか、`__Host-`/`__Secure-` prefix の適否を確認"
    - "セッション Cookie と CSRF/その他 Cookie で属性が適切に分かれているか確認"

WSTG-SESS-03:
  purpose: "ログイン前のセッション ID が継続利用されないか（セッション固定）を確認する。"
  pass: "認証成功時にセッション ID が再発行され、旧 ID は無効になる。"
  fail: "ログイン前後で同じセッション ID が使え、事前に仕込んだ ID で認証済みセッションを乗っ取れる。"
  note: "権限が変わる操作（昇格・切替）でも再発行されるかを見る。"
  steps:
    - "ログイン前のセッション ID を Burp で控え、ログイン後に同じ ID が使い続けられる（再発行されない）か確認"
    - "攻撃者が用意した ID を被害者に食わせてログインさせ、その ID で成り済ませるか検証"
    - "URL/パラメータでセッション ID を注入できないか確認"
    - "ログイン成功時に必ず新しい ID が発行されるなら pass。据え置きなら固定攻撃可として fail"

WSTG-SESS-04:
  purpose: "セッショントークンが漏れやすい場所に出ていないかを確認する。"
  pass: "トークンが Cookie でのみ送受信され、URL・ログ・Referer・エラー画面に現れない。"
  fail: "URL クエリやリダイレクト先にトークンが載る、外部サイトへ Referer で漏れる。"
  note: "外部リソース（CDN・解析タグ）を読み込む画面での Referer 挙動を確認する。"
  steps:
    - "セッション ID・トークンが URL・ログ・Referer・隠しフィールドに露出しないか Burp の HTTP 履歴で確認"
    - "ブラウザ開発者ツールで localStorage/sessionStorage にセッション情報が平文保存されないか確認"
    - "わざとエラーを誘発し（不正な型・存在しないID・巨大値・壊れたJSON）、返るエラーページ・スタックトレース・デバッグ出力に セッションID/トークン/内部変数が載らないか確認する（応答本文を `grep -iE \"session|token|PHPSESSID|JSESSIONID|csrf\"` 相当で走査）。載る＝ログ・画面経由の漏えい"
    - "TLS で保護されていても、URL 露出はブラウザ履歴/プロキシログに残る点を finding に添える"

WSTG-SESS-05:
  purpose: "状態変更操作が CSRF 対策で守られているかを確認する。"
  pass: "状態変更に単回性のトークンが必要、または SameSite と Origin/Referer 検証で守られている。"
  fail: "トークンなし・検証なし・トークンを削除しても成功する・ユーザ間で使い回せる。"
  note: "PoC の HTML を artifacts に置くと再現手順として最も分かりやすい。"
  steps:
    - "状態変更操作（送金・設定変更・削除）のリクエストに CSRF トークンがあるか Burp で確認"
    - "トークンを Burp Repeater で削除/固定値に改変して再送し、受理されるか（検証されているか）試す"
    - "トークンがセッションに紐づくか（他人のトークンが通らないか）、`SameSite` Cookie で守られているか確認"
    - "GET で状態変更できる/`Referer`・`Origin` 検証がない箇所を CSRF 可として finding に"

WSTG-SESS-06:
  purpose: "ログアウトでセッションが確実に破棄されるかを確認する。"
  pass: "ログアウト後、旧トークンでのリクエストがすべて拒否される（サーバ側で失効）。"
  fail: "ログアウト後も旧トークンが使える、Cookie 削除だけでサーバ側が失効していない。"
  note: "ログアウトボタンが分かりにくい／存在しない場合も所見として記録する。"
  steps:
    - "ログアウト後、直前のセッション Cookie を Burp で再送し、まだ有効でないか確認"
    - "ログアウトがサーバ側でセッション破棄しているか（クライアント Cookie 削除だけでないか）確認"
    - "「戻る」ボタン・複数タブ・別デバイスのセッションがログアウトで無効化されるか確認"
    - "明示的なログアウト導線の有無と、タイムアウト（SESS-07）との合わせ技も確認"

WSTG-SESS-07:
  purpose: "セッションのタイムアウトが適切に働くかを確認する。"
  pass: "無操作タイムアウトと絶対タイムアウトがあり、業務リスクに見合った長さ。"
  fail: "タイムアウトがない、極端に長い、またはクライアント側だけで制御している。"
  note: "計測には時間がかかる。放置して再試行する手順を run.yaml の steps に残す。"
  steps:
    - "ログイン後に放置し、Burp で保持したセッションが無効化されるまでの時間を計測"
    - "無効化がサーバ側判定か（クライアント時計依存でないか）を、Cookie の有効期限と実挙動で確認"
    - "機微度に対しタイムアウトが長すぎないか（例: 銀行系で数時間）を評価"
    - "アイドルタイムアウトと絶対タイムアウトの両方の有無を確認"

WSTG-SESS-08:
  purpose: "同一のセッション変数が複数用途で使い回され、状態を取り違えないかを確認する。"
  pass: "認証・リセット・登録など機能ごとに独立した状態を持ち、途中状態で他機能に入れない。"
  fail: "パスワードリセットの途中状態が認証済みとして扱われる等、フローをまたいで権限が湧く。"
  note: "複数フローを並行して開始し、途中で行き来するのが見つけ方のコツ。"
  steps:
    - "認証途中・パスワードリセット途中など中間状態で発行される変数/セッションを Burp で確認"
    - "中間状態のセッションを使い Burp で本来到達できない後続画面へ進めないか試す"
    - "同一セッションが複数のロール/フローで再利用され、状態が混線しないか確認"
    - "状態遷移を飛ばす/巻き戻すことで権限や本人確認を回避できないか検証"

WSTG-SESS-09:
  purpose: "取得したトークンが別環境から再利用できないか（ハイジャック成立性）を確認する。"
  pass: "トークンが盗まれても、再利用時に追加検証（再認証・端末束縛）や短寿命で被害が限定される。"
  fail: "別 IP・別ブラウザで同じトークンをそのまま使い、完全に成りすませる。"
  note: "検証は自分のアカウント間で行う。他人のセッションは決して使わない。"
  steps:
    - "有効なセッション ID を別ブラウザ/別 IP にコピーし、同時に使えるか（バインドがないか）確認"
    - "セッションが IP/User-Agent 等の属性に紐づくか、盗んだ ID だけで Burp で成り済ませるか検証"
    - "XSS/ネットワーク傍受でトークンを取れた場合の悪用可否を、取得済みトークンで確認"
    - "同時多重ログインの検知・失効の有無を確認"

WSTG-INPV-01:
  purpose: "URL・フォームの入力がそのまま応答に反映され、スクリプトが実行されないかを確認する。"
  pass: "入力が文脈に応じてエスケープされ、ペイロードが文字列として表示される。"
  fail: "反射した入力がスクリプトとして実行される（HTML・属性・JS・URL いずれの文脈でも）。"
  note: "出力文脈ごとにペイロードを変える。WAF による部分ブロックは緩和であって修正ではない。"
  steps:
    - "各パラメータに `<script>alert(1)</script>` や `\"><img src=x onerror=alert(1)>` を入れ、応答に無害化されず反映されるか確認"
    - "反映位置（HTML本文/属性値/JS内/URL）ごとに文脈に合ったペイロードを使い分ける"
    - "Burp で全パラメータを一括テスト、フィルタは大小文字・エンコード・イベントハンドラ変種で迂回を試す"
    - "実際にブラウザで JS が実行されるか（アラート表示）まで確認して finding にする"

WSTG-INPV-02:
  purpose: "保存された入力が、他の利用者の画面でスクリプトとして実行されないかを確認する。"
  pass: "保存値が表示時に適切にエスケープされる。"
  fail: "保存した値が別ユーザ・管理画面で実行される（管理画面での発火は重大度が上がる）。"
  note: "投入したテストデータは記録し、可能なら試験後に削除する。"
  steps:
    - "コメント・プロフィール・投稿等の保存系入力に XSS ペイロードを Burp で保存し、別画面/別ユーザで表示時に発火するか確認"
    - "保存→表示の経路（管理画面・通知・PDF/メール生成）を横断して発火点を探す"
    - "格納時と表示時のどちらでエスケープされるか、抜ける経路がないか確認"
    - "被害範囲（誰の画面で発火するか＝管理者含むか）を finding に明記"

WSTG-INPV-04:
  purpose: "同名パラメータを複数送ったときの解釈揺れを悪用できないかを確認する。"
  pass: "重複パラメータが拒否されるか、経路上のすべての要素で同じ解釈になる。"
  fail: "WAF とアプリで解釈が異なり、検証を通過して別の値が使われる。"
  note: "フロント（WAF/LB）とバックエンドの解釈差が本質。両方の応答を並べて記録する。"
  steps:
    - "同名パラメータを2つ以上付けて Burp Repeater で送り（`?id=1&id=2`）、サーバがどちらを採用するか確認"
    - "GET/POST 双方に同名を置く、配列表記（`id[]`）を混ぜるなどで挙動差を見る"
    - "WAF/認可チェックと実処理が別々の値を見て、検証を迂回できないか試す"
    - "採用規則の違い（先勝ち/後勝ち/連結）を利用した認可迂回・値注入を確認"

WSTG-INPV-05:
  purpose: "入力が SQL 文の構造に影響しないかを確認する。"
  pass: "入力を変えてもエラー・応答時間・件数に構造的な変化がなく、プレースホルダ利用が確認できる。"
  fail: "エラーベース・ブーリアン・時間差のいずれかで SQL の挙動を制御できる。"
  note: "sqlmap は許可範囲と負荷に注意。--risk/--level を上げる前に合意を取る。"
  steps:
    - "各パラメータに `'` `\"` を入れ、SQL エラー・応答差・500 が出るか確認"
    - "`' OR '1'='1' -- ` や `1 AND 1=1`/`1 AND 1=2` の真偽差でブラインド SQLi を確認"
    - "時間差（`' OR SLEEP(5)-- `）で盲目的注入を確認。文脈（数値/文字列）に応じて調整"
    - "`sqlmap -u \"https://target/x?id=1\" ${WSTG_PAUSE:+--delay \"$WSTG_PAUSE\"} ${https_proxy:+--proxy=\"$https_proxy\"} --batch --output-dir=OUTDIR`（許可範囲で）で確証。取得データは要約のみ finding に。sqlmap は多数の試行を送るので、非力な対象では `export WSTG_PAUSE=2` でリクエスト間に待ちを入れる（既定 `--threads 1` のまま上げない）。sqlmap は環境変数のプロキシを見ないので、プロキシ経由なら `--proxy` を明示する"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    4: "sqlmap は多数の試行リクエストを送り、time-based 検出では遅延も伴う。`--batch` でも重い。非力な対象は `export WSTG_PAUSE=2` でリクエスト間に待ちを入れ、`--threads` は上げない。許可範囲・時間帯を守る。"

WSTG-INPV-06:
  purpose: "入力が LDAP フィルタの構造に影響しないかを確認する。"
  pass: "特殊文字（* ( ) \\ NUL）がエスケープされ、フィルタが壊れない。"
  fail: "* や )(uid=* 等で認証迂回・全件取得ができる。"
  note: "認証画面と検索画面の両方が入口になり得る。"
  steps:
    - "LDAP 検索を伴う入力（ログイン・ユーザ検索）に `*` `)(uid=*)` `*)(|(uid=*` を Burp Repeater で入れて挙動を確認"
    - "`*` で全件が返る、認証入力で `*)(&` 等により認証を迂回できないか試す"
    - "エラー応答から LDAP 使用の兆候（LDAP: error code）を確認"
    - "フィルタ構文が壊れて全件取得/認証迂回に至った場合は finding に"

WSTG-INPV-07:
  purpose: "XML 入力の解析で構造改変や外部実体参照（XXE）が起きないかを確認する。"
  pass: "外部実体・DTD が無効化され、タグ挿入も無害化される。"
  fail: "XXE でファイル読み出し・SSRF ができる、または XML 構造を改変して業務値を変えられる。"
  note: "SOAP・SAML・ファイルアップロード（docx/svg）も XML の入口。"
  steps:
    - "XML を受け取る入力に `<` `>` `]]>` 等を入れ、構造を壊せる/エラーになるか確認"
    - "XXE を狙い `<!DOCTYPE x [<!ENTITY e SYSTEM \"file:///etc/passwd\">]>&e;` を `curl`/Burp で送りファイル読取を試す"
    - "外部エンティティ・パラメータエンティティ・SSRF（`http://` 参照）の受理可否を確認"
    - "XML パーサが外部エンティティを解決する場合は XXE として重大度高めで finding に"

WSTG-INPV-08:
  purpose: "SSI（Server Side Includes）ディレクティブが入力経由で実行されないかを確認する。"
  pass: "SSI が無効、または入力中の <!--#exec 等が文字列として扱われる。"
  fail: "SSI ディレクティブが解釈され、ファイル読み出しやコマンド実行に至る。"
  note: ".shtml が有効なレガシー環境で残っていることがある。"
  steps:
    - "SSI を使い得る環境で入力に `<!--#exec cmd=\"id\"-->` `<!--#include file=\"...\"-->` を Burp で注入"
    - "反映先が `.shtml` 等 SSI 有効ページか、注入がサーバ側で解釈されるか確認"
    - "コマンド実行・ファイルインクルードが成立するか、出力で確認"
    - "レガシー環境で残りがち。成立時は RCE 相当として扱う"

WSTG-INPV-09:
  purpose: "入力が XPath クエリの構造に影響しないかを確認する。"
  pass: "特殊文字がエスケープされ、クエリ構造が変わらない。"
  fail: "' or '1'='1 相当で認証迂回や全ノード取得ができる。"
  note: "XML をユーザ DB に使っている環境で発生する。SQLi と同じ考え方で試す。"
  steps:
    - "XPath クエリを伴う入力に `' or '1'='1` `x' or name()='` を Burp Repeater で入れ、認証迂回/全件取得を試す"
    - "真偽差・エラーからブラインド XPath 注入が可能か確認"
    - "XML データストアを使うログイン等で、フィルタが壊れて迂回できないか確認"
    - "成立経路（どの入力・どのクエリ）を finding に明記"

WSTG-INPV-10:
  purpose: "メール送信機能経由で IMAP/SMTP コマンドを注入できないかを確認する。"
  pass: "改行（CR/LF）が除去・拒否され、ヘッダを追加できない。"
  fail: "件名・宛先欄に改行を入れてヘッダ追加や第三者中継ができる。"
  note: "問い合わせフォームが典型。スパム踏み台化の観点でも重大。"
  steps:
    - "メール送信/検索機能の入力に CRLF（`%0d%0a`）やコマンド区切りを Burp で注入し、ヘッダ/コマンドを追加できるか確認"
    - "IMAP/SMTP コマンド（`\\r\\nHELO`・追加 `To:`/`Bcc:`）を注入して迷惑メール中継等ができないか試す"
    - "メールヘッダインジェクション（件名/宛先の改ざん・追加）が成立するか確認"
    - "成立時は迷惑メール踏み台・情報漏えいリスクとして finding に"

WSTG-INPV-11:
  purpose: "入力がサーバ側でコードとして評価されないかを確認する。"
  pass: "入力が eval 等に渡らず、渡る場合も厳格に検証されている。"
  fail: "入力片がコードとして評価され、任意処理を実行できる（LFI/RFI 経由の実行を含む）。"
  note: "実行確認は無害なコマンド（sleep・ping 相当）に留め、影響範囲を広げない。"
  steps:
    - "評価系入力に言語別コード（PHP `;phpinfo();`、`system('id')`、`__import__('os')`）を Burp で注入し実行されるか確認"
    - "eval/デシリアライズ/テンプレート等コードが評価される経路を特定"
    - "時間差・アウトオブバンド（Burp Collaborator 等の DNS/HTTP コールバック）で盲目的に実行確認"
    - "成立時は RCE として最優先で finding に。実証は最小限に留める"

WSTG-INPV-12:
  purpose: "入力が OS コマンドの一部として実行されないかを確認する。"
  pass: "シェルを介さない実行、または引数のホワイトリスト検証がされている。"
  fail: "; | && $() 等でコマンドを連結・実行できる（時間差やアウトオブバンドで確認）。"
  note: "破壊的コマンドは絶対に使わない。id・sleep など無害なもので証明する。"
  steps:
    - "OS コマンドを組み立てる入力に `; id` `| id` `$(id)` `` `id` `` `&& id` を注入して実行されるか確認"
    - "出力が返らない場合は時間差（`; sleep 5`）・アウトオブバンド（`; nslookup me.oob`）で確認"
    - "Windows 系は `& whoami` `| whoami` も試す"
    - "成立時は RCE として最優先。実行は無害コマンド（id/whoami）に留め finding に要約"

WSTG-INPV-13:
  purpose: "入力が書式文字列としてそのまま処理されないかを確認する。"
  pass: "%s %x 等が単なる文字として扱われる。"
  fail: "書式指定子がメモリ内容の露出やクラッシュを引き起こす。"
  note: "C/C++ のネイティブ部品を持つアプリで主に該当。Web アプリでは稀。"
  steps:
    - "書式指定を扱い得る入力（主にネイティブ実装）に `%s%s%s%s` `%x%x%x` `%n` を `curl`/Burp で入れ、クラッシュ/メモリ露出を確認"
    - "応答にスタックの値が漏れる・落ちるかを観察"
    - "Web アプリでは稀。C/C++ ネイティブ部品を持つ場合に重点確認"
    - "成立時はメモリ破壊/情報漏えいとして finding に"

WSTG-INPV-14:
  purpose: "保存された不正データが後続処理で発火する（潜伏型）欠陥がないかを確認する。"
  pass: "保存時・利用時の両方で検証・エスケープされる。"
  fail: "保存時は無害でも、バッチ・帳票・管理画面など別経路で発火する。"
  note: "発火先が管理者画面や外部連携先の場合、重大度を上げる。"
  steps:
    - "単体では無害でも、保存→別処理で発火する連鎖（例: 保存 XSS が管理バッチで実行）を探す"
    - "入力が時間差・別コンポーネント経由で悪用される経路を業務フローから推定"
    - "複数の弱点（格納＋後段の信頼）を Burp で組み合わせて成立するシナリオを検証"
    - "単発テストで見落とす連鎖を finding にシナリオとして整理"

WSTG-INPV-15:
  purpose: "リクエスト/レスポンスの境界解釈のずれを悪用できないかを確認する。"
  pass: "CR/LF がヘッダに注入できず、Content-Length と Transfer-Encoding の扱いが経路全体で一貫している。"
  fail: "ヘッダ分割、またはフロントとバックの解釈差でリクエストを密輸できる。"
  note: "スマグリング検証は他利用者に影響し得る。実施前に必ず合意と時間帯調整を行う。"
  steps:
    - "リクエスト/応答に CRLF（`%0d%0a`）を `curl`/Burp で注入し、ヘッダ分割・レスポンス分割ができるか確認"
    - "フロント/バックの解釈差を突く smuggling（`Content-Length` と `Transfer-Encoding` の食い違い）を検証"
    - "キャッシュポイズニング・認可迂回につながらないか確認"
    - "中間装置（CDN/LB）構成に依存するため、成立条件と経路を finding に明記"

WSTG-INPV-16:
  purpose: "リバースプロキシ等が受け取るリクエストの扱いに、迂回や露出がないかを確認する。"
  pass: "内部向けパス・管理系へのリクエストが前段で確実に遮断される。"
  fail: "パス正規化の差やヘッダ細工で、前段の制限を越えて内部へ到達できる。"
  note: "前段機器の設定ヒアリングと突き合わせないと誤判定しやすい。"
  steps:
    - "サーバが受け付ける生リクエスト（異常メソッド・巨大ヘッダ・不正 Host）を `ncat`/`curl` で送り挙動を確認"
    - "リクエスト解析の甘さ（不正な行終端・重複ヘッダ）で異常応答が出ないか確認"
    - "監視・WAF が生の異常リクエストを取りこぼさないか確認"
    - "他の注入系（INPV-15/17）と併せて解釈差を検証"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    1: "巨大ヘッダ・異常リクエストはサーバのパースでリソースを食い、終端によっては不安定化しうる。サイズは段階的に上げる。"

WSTG-INPV-17:
  purpose: "Host ヘッダの値を信用した処理がないかを確認する。"
  pass: "Host を偽装しても、リンク生成・リセットメール・キャッシュキーに反映されない（許可ホストのみ）。"
  fail: "偽装した Host がリセットリンクや絶対 URL に反映される、キャッシュポイズニングにつながる。"
  note: "X-Forwarded-Host など類似ヘッダも試す。"
  steps:
    - "`Host:` を任意値に書き換えて応答への反映を確認: `curl -s -D - -o OUTDIR/host-body.html -H 'Host: evil.example' https://target/ | tee OUTDIR/host-headers.txt; echo '--- 反映チェック ---'; grep -in 'evil.example' OUTDIR/host-headers.txt OUTDIR/host-body.html || [ $? -eq 1 ]`。`Location`/絶対 URL/本文に `evil.example` が現れたら Host 依存のリンク生成があり、手順2（リセットリンク等）へ進む"
    - "パスワードリセットのリンク生成に Host が使われ、リセット URL を攻撃者ドメインに向けられないか試す"
    - "`X-Forwarded-Host` 等でキャッシュポイズニング・認可迂回ができないか確認"
    - "Host 依存のリンク生成・ルーティングがある場合は影響を finding に"

WSTG-INPV-18:
  purpose: "入力がテンプレートエンジンの式として評価されないかを確認する。"
  pass: "{{7*7}} 等が文字列のまま表示される。"
  fail: "式が評価されて 49 が返る、さらにオブジェクトアクセスからコード実行に至る。"
  note: "エンジン特定後の深追いは影響が大きい。評価成立の証明までで止めるのが基本。"
  steps:
    - "テンプレートに渡り得る入力に `{{7*7}}` `${7*7}` `#{7*7}` `<%= 7*7 %>` を Burp Repeater で入れ、`49` に評価されるか確認"
    - "評価された場合はエンジンを特定し、対応ペイロードで内部変数/コマンド実行に到達できるか確認"
    - "反映先がサーバ側テンプレート（メール/PDF/画面）か切り分ける"
    - "SSTI が RCE に至る経路を確認。実証は最小限に留め finding に"

WSTG-INPV-19:
  purpose: "サーバに任意の宛先へリクエストさせられないかを確認する。"
  pass: "外部 URL 指定が許可リストで制限され、内部アドレス・メタデータエンドポイントへ到達できない。"
  fail: "内部 IP・169.254.169.254・localhost への到達や、外部への任意リクエスト（DNS/HTTP）ができる。"
  note: "盲目的 SSRF は Collaborator/interactsh の受信ログを証拠にする。"
  steps:
    - "URL/ホストを受け取る入力（`?url=`,`?image=`,webhook）に `http://169.254.169.254/`（クラウドメタデータ）を `curl`/Burp で指定し取得できるか確認"
    - "内部 IP（`http://127.0.0.1:port`,`http://10.x`）へのアクセスや、`file://`/`gopher://` スキームを試す"
    - "リダイレクト・DNS リバインド・別表記（`http://0x7f000001`）でフィルタ迂回を試す"
    - "内部到達・メタデータ取得が成立したら SSRF として重大度高めで finding に"

WSTG-ERRH-01:
  purpose: "エラー応答が内部情報を漏らしていないかを確認する（スタックトレースを含む）。"
  pass: "異常系でも汎用エラー画面が返り、内部パス・SQL・スタックトレース・製品バージョンが出ない。"
  fail: "例外のスタックトレース・SQL エラー・内部パス・デバッグ情報がそのまま表示される。"
  note: "4xx/5xx の両方、API とフロントの両方で確認する。v4.2 では ERRH-02 がここに統合。"
  steps:
    - "エラーを誘発して内部情報の漏れを確認する: `for u in '/nope-$(date +%s)' '/%c0%ae/' '/?id=%27' '/api/nope'; do echo \"===== $u =====\"; curl -s -m 10 \"https://target$u\" | grep -iE 'exception|stack trace|at [a-z0-9_.]+\\(|sql|syntax error|ORA-|PDOException|Traceback|line [0-9]+|/var/www|C:\\\\\\\\|Warning:|Fatal error' | head -20; done | tee OUTDIR/error-leak.txt`。ヒットしたら詳細エラーが露出＝finding。存在しないパスに加え、各エンドポイントの型不一致・不正入力も手動で試す"
    - "4xx/5xx の両方、API（JSON）とフロント（HTML）の両方で応答本文を確認"
    - "エラー時に内部情報（フレームワーク・DB・内部 IP・バージョン）が漏れないか確認"
    - "詳細が出る箇所を列挙。v4.2 では ERRH-02（スタックトレース）もここに統合して判定"

WSTG-CRYP-01:
  purpose: "TLS の構成（プロトコル・暗号スイート・証明書）が現行水準を満たすかを確認する。"
  pass: "TLS1.2/1.3 のみ、弱い暗号スイートなし、証明書が有効で信頼チェーンが正しい。"
  fail: "SSLv3/TLS1.0/1.1 が有効、RC4/3DES/NULL/EXPORT が有効、証明書が期限切れ・自己署名・名前不一致。"
  note: "対象は Web だけでなく、メール・API・管理ポートの TLS も含める。"
  steps:
    - "`testssl ${https_proxy:+--proxy=auto} --logfile OUTDIR/testssl.log https://target` または `sslyze ${https_proxy:+--https_tunnel=\"$https_proxy\"} --json_out OUTDIR/sslyze.json target:443 || [ $? -eq 1 ]` で全 TLS ポートを一括検査（sslyze v5 は引数なしで標準スキャン。`--regular` は廃止。sslyze は Mozilla intermediate 設定に不適合だと CI 向けに exit 1 を返すが、これは実行失敗ではなく判定材料（出力末尾の COMPLIANCE 節が不適合の理由）なので `|| [ $? -eq 1 ]` で成功扱いにする。プロキシ経由で対象に出る環境では testssl は `--proxy=auto`＝env の http(s)_proxy を使い、sslyze は `--https_tunnel` で CONNECT する。プロキシ配下では一部の低レベル検査が制限されることがあるので、結果に警告が出たら手順4の nmap で裏取りする）。Kali の apt 版（testssl.sh パッケージ）のコマンド名は `.sh` なしの testssl。git clone 版で testssl.sh しか無いときは `sudo ln -s \"$(command -v testssl.sh)\" /usr/local/bin/testssl` で揃える"
    - "SSLv3/TLS1.0/1.1・弱い暗号スイート（RC4/3DES/EXPORT）・弱い鍵長が有効でないか確認"
    - "証明書の有効期限・発行者・ホスト名一致、既知脆弱性（Heartbleed/ROBOT 等）を確認"
    - "`nmap --script ssl-enum-ciphers -p443 -oN OUTDIR/nmap-ssl-ciphers.txt target` で裏取り。結果は artifacts/tls-summary.md に"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    1: "testssl / sslyze は多数の TLS ハンドシェイクを張る。低スペックな終端やロードバランサに負荷がかかることがある。"
    4: "`nmap --script ssl-enum-ciphers` も多数のハンドシェイクを試みる。手順1と重ねて連続実行しない。"

WSTG-CRYP-02:
  purpose: "暗号文の改変に対する応答差から平文を復元できないか（パディングオラクル）を確認する。"
  pass: "復号失敗時の応答が一様で、パディング誤りと内容誤りを区別できない。"
  fail: "応答内容・ステータス・時間差で復号可否が判別でき、平文を復元できる。"
  note: "対象は Cookie・ViewState・URL 中の暗号化トークン。実行前に負荷と件数を合意する。"
  steps:
    - "暗号化トークン/Cookie を1バイトずつ改変して送り（Burp/`padbuster`）、パディングエラーと復号エラーで応答差が出るか確認"
    - "CBC モードの復号を伴うパラメータ（暗号化された ViewState/Cookie）を対象に選ぶ"
    - "応答差・エラーメッセージ・応答時間からパディングオラクルの兆候を確認"
    - "成立時は平文復元/改ざんの可能性。実証は最小限に留め finding に"

WSTG-CRYP-03:
  purpose: "機微情報が暗号化されない経路で送られていないかを確認する。"
  pass: "資格情報・個人情報・トークンがすべて TLS 経路のみで送受信される。"
  fail: "HTTP での送信、平文プロトコル（FTP/Telnet/SMTP 平文）の利用、機微情報の GET クエリ露出がある。"
  note: "HTTPS 画面から HTTP の API を呼ぶ混在も対象。"
  steps:
    - "Burp history で、機微情報（資格情報・トークン・個人情報）が HTTP（平文）で送られていないか確認"
    - "混在コンテンツ（HTTPS ページ内の HTTP リソース）や、HTTP へフォールバックする経路を確認"
    - "機微データが URL・Referer に載って外部へ漏れないか確認"
    - "平文送出の箇所を列挙。ATHN-01 と重複時は経路の違いを finding に区別して記載"

WSTG-CRYP-04:
  purpose: "使用している暗号アルゴリズム・鍵・乱数が十分な強度かを確認する。"
  pass: "現行標準（AES-GCM 等）・十分な鍵長・安全な乱数源が使われ、パスワードは適切な KDF で保存される。"
  fail: "MD5/SHA1 でのパスワード保存、ECB モード、ハードコードされた鍵、予測可能な乱数を使用。"
  note: "外部からは判定しにくい。ソース・設計書のレビューまたはヒアリングとセットで行う。"
  steps:
    - "保存/送信データを Burp で観察し、暗号化方式（弱い ECB、独自暗号、可逆エンコードを暗号と誤認）を確認"
    - "パスワード保存が平文/MD5/SHA1 等の弱いハッシュ（ソルト無し）でないか、判る範囲で確認"
    - "ハードコードされた鍵・IV 使い回し・予測可能な乱数が使われていないか確認"
    - "暗号化と単なるエンコード（base64）の混同を見抜き、実質無防備な箇所を finding に"

WSTG-BUSL-01:
  purpose: "業務上ありえない値をサーバ側で拒否できているかを確認する。"
  pass: "数量・金額・日付などの業務制約がサーバ側で検証される。"
  fail: "負の数量・極端な金額・過去日付などが受理され、業務結果が変わる。"
  note: "クライアント側検証しかない場合は必ず fail。プロキシで直接投げて確認する。"
  steps:
    - "業務データ（金額・数量・日付・状態）を業務上あり得ない値（負数・0・過大・過去日）に改変して受理されるか確認"
    - "クライアント側バリデーションを Burp で外し、サーバ側が同じ検証をしているか確認"
    - "型・範囲・整合性（合計と明細の一致等）のサーバ側検証の抜けを探す"
    - "業務ルールに反する状態を作れた場合、業務影響とともに finding に"

WSTG-BUSL-02:
  purpose: "画面が出さない値やパラメータを自作リクエストで送り込めないかを確認する。"
  pass: "想定外パラメータが無視され、価格・権限・状態は常にサーバ側の値が使われる。"
  fail: "隠しフィールドや未提示パラメータ（price, role, discount 等）を送ると結果が変わる。"
  note: "hidden フィールドと JS の中の定数が探索の入口。"
  steps:
    - "画面に出ない/無効化されたパラメータ（`price`,`status`,`userId`）を Burp Repeater でリクエストに追加/改変して通るか確認"
    - "本来サーバが決めるべき値（価格・権限・所有者）をクライアントから指定して上書きできないか試す"
    - "正規フローでは送られないフィールドを推測して注入する"
    - "サーバが信頼すべきでない入力を信頼している箇所を finding に"

WSTG-BUSL-03:
  purpose: "データの整合性チェック（改ざん検知）が機能しているかを確認する。"
  pass: "サーバ側の値が正とされ、クライアント由来の値は検証・再計算される。"
  fail: "署名なしのトークンや合計値をクライアントが決められ、改ざんが検出されない。"
  note: "監査ログの改ざん可否も観点に含める。"
  steps:
    - "改ざん検知が必要なデータ（署名付きトークン・金額・数量）を Burp で改変し、整合性チェックが働くか確認"
    - "隠しフィールド・Cookie・JWT の署名を外す/改変して受理されるか試す"
    - "サーバ側で再計算・再検証しているか（クライアント値を鵜呑みにしないか）確認"
    - "整合性チェックが無い/迂回できる箇所を finding に"

WSTG-BUSL-04:
  purpose: "処理時間・順序の隙を突けないか（レースを含む）を確認する。"
  pass: "重要処理が排他制御され、並行実行しても二重適用されない。"
  fail: "同時実行でクーポン多重適用・残高の二重引き出し等が起きる。"
  note: "並行リクエストは負荷になる。件数と時間帯を事前に合意する。"
  steps:
    - "処理の応答時間差（成功/失敗・存在/非存在）を Burp/`curl` で計測し、情報が漏れないか確認"
    - "時間依存の業務（予約・在庫・クーポン）で、タイミングを突いた不正取得ができないか確認"
    - "レースコンディション（後述 BUSL-05 と関連）につながる時間窓がないか確認"
    - "計測結果（応答時間の統計）を artifacts に残し、判別可能性を finding に"

WSTG-BUSL-05:
  purpose: "回数制限のある機能が実際に制限されているかを確認する。"
  pass: "上限回数がサーバ側で管理され、超過すると拒否される。"
  fail: "クーポン・投票・試行などが無制限に繰り返せる。"
  note: "セッションを変える・並行実行するなど、制限の抜け道も試す。"
  steps:
    - "回数制限があるべき機能（クーポン適用・投票・出金・OTP 試行）を Burp Intruder で連続実行し、上限を超えられるか確認"
    - "並行リクエスト（レースコンディション）で、1回制限を複数回すり抜けられないか試す"
    - "サーバ側でカウント/ロックしているか、クライアント側制御だけでないか確認"
    - "上限超過・二重処理ができた場合、業務影響とともに finding に"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    1: "回数制限の検証は意図的な連続実行。出金・OTP など実処理を伴う機能では実際に副作用が起きる。テストデータ・テストアカウントで行う。"

WSTG-BUSL-06:
  purpose: "業務フローの順序を飛ばして目的の状態に到達できないかを確認する。"
  pass: "各ステップでサーバ側の状態が検証され、途中を飛ばすと拒否される。"
  fail: "支払い前に完了状態へ進める、承認を経ずに確定できる等。"
  note: "「戻る」「直リンク」「並行タブ」の3パターンを試すと出やすい。"
  steps:
    - "多段フロー（申込→承認→確定、カート→決済）の途中ステップを URL 直打ち/Burp で飛ばせるか確認"
    - "順序を入れ替える・前工程を省く・完了後に前工程へ戻ると状態が不整合にならないか確認"
    - "各ステップでサーバ側が前提状態を検証しているか確認"
    - "ワークフローを迂回して不正な最終状態（未払い確定等）を作れた場合は finding に"

WSTG-BUSL-07:
  purpose: "想定外の使い方をされたときにアプリが検知・防御するかを確認する。"
  pass: "異常な利用（大量リクエスト・不正パラメータ連発）を検知し、記録・遮断・通知が行われる。"
  fail: "明らかな攻撃パターンを繰り返しても検知も抑止もされない。"
  note: "検知の有無は顧客側のログ確認が必要。ヒアリング結果も evidence に残す。"
  steps:
    - "異常な使い方（高速連打・想定外の順序・大量リクエスト）を Burp Intruder で行い、検知/抑止する仕組みがあるか確認"
    - "不正操作に対する監視・アラート・レート制限・アカウント制限の有無を確認"
    - "自動化ツールでの操作をアプリが検知/妨害するか確認"
    - "誤用に対する能動的防御が無い場合、悪用容易性として finding に"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    1: "高速連打・大量リクエストは事実上の負荷試験になる。検知/抑止の確認が目的なので、対象が耐えられる範囲で段階的に。"

WSTG-BUSL-08:
  purpose: "想定外の種類のファイルをアップロードできないかを確認する。"
  pass: "拡張子と実際の中身（マジックバイト）の両方を検証し、許可種別のみ受理する。"
  fail: "拡張子偽装・Content-Type 偽装で、許可されていない種類のファイルが保存される。"
  note: "保存先が Web 公開領域かどうかで重大度が大きく変わる。"
  steps:
    - "アップロード機能に想定外の拡張子/MIME（`.php`,`.jsp`,`.svg`,`.html`）を Burp で上げて受理されるか確認"
    - "拡張子偽装（`shell.php.jpg`）・MIME 偽装・大小文字・二重拡張子でフィルタを迂回できるか試す"
    - "アップロード先が Web からアクセス可能で、かつ実行されないか確認"
    - "受理されるべきでない型が通った場合、後段の実行リスク（BUSL-09）と併せ finding に"

WSTG-BUSL-09:
  purpose: "悪意あるファイルの投入と実行が防がれているかを確認する。"
  pass: "実行可能ファイルが保存されない、保存されても Web から実行できず、マルウェアスキャンがある。"
  fail: "Web シェルを保存して実行できる、EICAR がスキャンされず保存される。"
  note: "実際のマルウェアは使わない。EICAR と無害なスクリプトで検証する。"
  steps:
    - "実行可能/悪性ファイル（Web シェル・EICAR テストウイルス・巨大ファイル・XXE 入り docx/svg）を上げて処理を確認"
    - "アップロードされた実行ファイルが Web ルートで実行できないか（`curl` で叩く）確認"
    - "ウイルススキャン・サイズ/型検証・保存場所の分離が機能しているか確認"
    - "実行や被害が成立したら重大度高めで finding に。検証は EICAR 等の無害検体で"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    1: "巨大ファイルや XXE 入りファイルのアップロードは処理側のメモリ/CPU/ディスクを圧迫しうる。サイズは控えめにし、検体は EICAR 等の無害なものを使う。"

WSTG-CLNT-01:
  purpose: "クライアント側 JS のシンクで XSS が成立しないかを確認する。"
  pass: "location.hash 等のソースが innerHTML・eval 等のシンクに未処理で渡らない。"
  fail: "URL フラグメントやクエリが DOM シンクへ流れ、スクリプトが実行される。"
  note: "サーバ応答は無害でも成立する。フラグメントはサーバログに残らない点も説明する。"
  steps:
    - "URL フラグメント/パラメータを DOM に書き込む JS（`document.write`,`innerHTML`,`location`,`eval`）をブラウザ開発者ツールの Sources で探す"
    - "`#<img src=x onerror=alert(1)>` 等をシンクに流し込み、サーバを介さず DOM 上で発火するか確認"
    - "ソース（`location.hash`,`document.referrer`）→シンクの経路を DevTools や Burp DOM Invader で追跡"
    - "どのシンクで成立したかを finding に明記（CLNT-01 と INPV-01 の切り分け）"

WSTG-CLNT-02:
  purpose: "入力が JS の実行文脈に入り込まないかを確認する。"
  pass: "JS 文字列に埋め込まれる値がエスケープされ、文脈を抜け出せない。"
  fail: "eval / setTimeout / Function に外部由来の値が渡り実行される。"
  note: "CLNT-01 と重なる。どのシンクで成立したかを finding に明記する。"
  steps:
    - "`javascript:` スキームや DOM 経由でユーザ入力が `eval`/`setTimeout`/`Function` に渡らないか確認"
    - "入力から JS 実行に至る経路をブラウザ開発者ツール（DevTools）のブレークポイントで追う"
    - "フレームワークのテンプレート評価（`ng-`,`v-` バインド等）で式が実行されないか確認"
    - "実行が成立するシンクを finding に。DOM XSS（CLNT-01）と重なる点に注意"

WSTG-CLNT-03:
  purpose: "入力が HTML として解釈され、画面を改変できないかを確認する。"
  pass: "タグがエスケープされ、文字列として表示される。"
  fail: "任意タグ挿入で偽のフォーム・リンクを差し込める（スクリプト実行に至らなくてもフィッシングに使える）。"
  note: "スクリプトが動かなくても指摘対象。影響は「見た目の改変＋誘導」で説明する。"
  steps:
    - "入力が HTML として反映される箇所に `<h1>test</h1>` `<b>` 等を Burp/ブラウザで入れ、タグが解釈されるか確認"
    - "スクリプト無しでもコンテンツ偽装・フィッシング用の要素を差し込めるか確認"
    - "反映先の文脈（本文/属性）に応じてタグ注入の成否を確認"
    - "HTML 注入が成立する箇所を finding に（XSS に発展し得るかも併記）"

WSTG-CLNT-04:
  purpose: "リダイレクト先をクライアント側入力で任意指定できないかを確認する。"
  pass: "遷移先が許可リストまたは相対パスに限定される。"
  fail: "?next=//evil.example のような指定で外部サイトへ遷移させられる。"
  note: "フィッシングの踏み台になる。ログイン後遷移が典型的な入口。"
  steps:
    - "リダイレクト先を決めるパラメータ（`?next=`,`?url=`,`?return=`）に外部 URL を `curl`/Burp で入れて飛ぶか確認"
    - "`//evil.example`・`https:evil.example`・`\\/\\/evil` などスキーム相対/変種で迂回を試す"
    - "オープンリダイレクトがフィッシング・OAuth トークン奪取に使えないか確認"
    - "外部ドメインへ誘導できた場合はオープンリダイレクトとして finding に"

WSTG-CLNT-05:
  purpose: "入力が CSS として解釈され、情報の抜き出しや表示改変ができないかを確認する。"
  pass: "スタイル指定に外部入力が渡らない。"
  fail: "任意 CSS を注入でき、属性セレクタ等で入力値を外部へ送出できる。"
  note: "影響の説明が難しい項目。PoC を artifacts に残すと伝わりやすい。"
  steps:
    - "スタイルに反映される入力に CSS 注入（`}body{background:url(...)}` や属性セレクタ）ができるか確認"
    - "CSS で入力値を推測・外部送信（属性セレクタ + 背景画像リクエスト）できないか確認"
    - "`style` 属性/`<style>` へのユーザ入力反映をブラウザ開発者ツールで確認"
    - "情報漏えい・画面改ざんにつながる注入を finding に"

WSTG-CLNT-06:
  purpose: "JS が読み込むリソース（スクリプト・iframe・データ）の URL を操作できないかを確認する。"
  pass: "読み込み先が固定または許可リスト制。"
  fail: "パラメータで読み込み元を差し替え、外部のスクリプトやコンテンツを読み込ませられる。"
  note: "JSONP エンドポイントが残っている場合は特に確認する。"
  steps:
    - "JS がユーザ制御データで動的にリソース URL（script/img/iframe の src）を組み立てないかブラウザ開発者ツールで確認"
    - "その URL に外部/悪性リソースを Burp で指定させて読み込ませられないか試す"
    - "`location`,`XMLHttpRequest`,`fetch` の宛先がユーザ入力で操作されないか確認"
    - "リソース読み込み先を乗っ取れた場合の影響を finding に"

WSTG-CLNT-07:
  purpose: "CORS 設定が過剰に緩くないかを確認する。"
  pass: "Access-Control-Allow-Origin が許可オリジンのみ、認証付きリクエストでワイルドカードや Origin 反射がない。"
  fail: "任意の Origin を反射しつつ Allow-Credentials: true、または null オリジンを許可している。"
  note: "プリフライトだけでなく、実リクエストの応答ヘッダで確認する。"
  steps:
    - "任意 Origin を送って CORS 応答ヘッダを保存する: `curl -s -D - -o /dev/null -H 'Origin: https://evil.example' https://target/api | tee OUTDIR/cors.txt`（HEAD だと CORS ヘッダが返らない実装があるので GET でヘッダのみ取得。`/api` は実際の API パスに置き換える）"
    - "手順1の応答から危険な組合せを自動判定する: `grep -iE 'access-control-allow-(origin|credentials):' OUTDIR/cors.txt | tee OUTDIR/cors-verdict.txt; if grep -qiE 'access-control-allow-origin:[[:space:]]*(https://evil\\.example|\\*)' OUTDIR/cors.txt && grep -qiE 'access-control-allow-credentials:[[:space:]]*true' OUTDIR/cors.txt; then echo '危険: 反射/ワイルドカード Origin + credentials=true（他サイトが認証付きで機微データを読める）'; fi`。この行が出たら fail 側の材料。`*` 単独（credentials 無し）や個別の正規 Origin 許可は、許可先の妥当性を手順3で確認する"
    - "任意/緩いオリジンからの認証付きリクエストで機微データを読めないか検証"
    - "過度に緩い CORS（旧指示の CONF-12 相当）を finding に"

WSTG-CLNT-08:
  purpose: "残存する Flash コンテンツに情報漏えい・XSS の余地がないかを確認する。"
  pass: "Flash コンテンツが存在しない（現在はこれが通常）。"
  fail: "swf が残り、allowScriptAccess 等の設定でスクリプト実行やクロスドメインアクセスができる。"
  note: "現行ブラウザでは実行されないが、資産として残っていれば整理を助言する。"
  steps:
    - "Flash（SWF）が残る環境で、`allowScriptAccess`/`allowDomain` の設定と外部からの制御可否を確認"
    - "SWF に渡るパラメータ（`FlashVars`）経由で JS 実行・遷移をブラウザで誘発できないか確認"
    - "レガシー技術。存在自体が縮退対象なので、残っていれば撤去も助言"
    - "成立する XSF 経路があれば finding に"

WSTG-CLNT-09:
  purpose: "画面を iframe に埋め込ませ、クリックを誘導できないかを確認する。"
  pass: "機微画面に X-Frame-Options: DENY/SAMEORIGIN か CSP frame-ancestors がある。"
  fail: "任意サイトから iframe 埋め込みでき、操作を誘導できる（PoC の HTML で確認）。"
  note: "対象は「状態を変える操作がある画面」。静的ページのみなら影響は限定的。"
  steps:
    - "WSTG-CONF-07 手順1 で保存した応答ヘッダから確認する（再取得しない）: `grep -iE '^(x-frame-options|content-security-policy):' OUTDIR/root-headers.txt || [ $? -eq 1 ]`（何も出なければ防御ヘッダなし）。CSP は `frame-ancestors` ディレクティブの有無を見る。単独実行で root-headers.txt が無いときは先に WSTG-CONF-07 を回す"
    - "対象ページを `<iframe src=...>` で自作 HTML に埋め込み、実際に表示されるか（枠に出るか）確認"
    - "重要操作（送金・設定変更）画面がフレーム内で操作可能なら Clickjacking 可"
    - "防御ヘッダが無い/緩い重要画面を finding に。PoC の iframe HTML を artifacts に"

WSTG-CLNT-10:
  purpose: "WebSocket の接続・認可・暗号化が適切かを確認する。"
  pass: "wss:// を使用し、ハンドシェイク時に認証・Origin 検証があり、メッセージも認可される。"
  fail: "ws:// の平文通信、Origin 検証なし（Cross-Site WebSocket Hijacking）、認可なしで他人のデータを取得できる。"
  note: "メッセージ単位の認可漏れを見落としやすい。接続後の操作も試す。"
  steps:
    - "DevTools の Network→WS で WebSocket 接続を確認し、ハンドシェイクの Origin 検証有無を見る"
    - "`wss://`（暗号化）か、認証・認可がメッセージ単位で行われているか確認"
    - "Burp で WS メッセージを傍受・改変し、認可迂回や注入ができないか試す"
    - "Origin 検証無し・平文 ws・入力無害化欠如を finding に"

WSTG-CLNT-11:
  purpose: "postMessage による画面間通信が安全かを確認する。"
  pass: "送信時に targetOrigin を明示し、受信時に event.origin を検証している。"
  fail: "targetOrigin が \"*\"、または origin 未検証のまま受信データを DOM/eval に渡している。"
  note: "受信側ハンドラを JS から探すのが早い。addEventListener('message') を検索する。"
  steps:
    - "`postMessage` の送受信をブラウザ開発者ツールで確認し、受信側が `event.origin` を検証しているか見る"
    - "任意オリジンからのメッセージを受理して DOM 操作/機微処理を行わないか確認"
    - "送信側が `targetOrigin` に `*` を使い、機微データを漏らさないか確認"
    - "オリジン検証欠如による XSS/情報漏えいを finding に"

WSTG-CLNT-12:
  purpose: "ブラウザストレージに機微情報が残っていないかを確認する。"
  pass: "localStorage/sessionStorage/IndexedDB に資格情報・トークン・個人情報を保存していない。"
  fail: "アクセストークンや個人情報が localStorage に平文で保存され、XSS で持ち出せる。"
  note: "ログアウト後にストレージが消えるかも確認する。"
  steps:
    - "ブラウザ開発者ツール→Application で localStorage/sessionStorage/IndexedDB/Cookie の中身を確認"
    - "セッショントークン・個人情報・機微データが平文で保存されていないか確認"
    - "保存データが XSS で読める（HttpOnly でない）・信頼して処理される経路がないか確認"
    - "機微データのクライアント保存を finding に（保存の是非と保護の両面で）"

WSTG-CLNT-13:
  purpose: "認証済みの JS/JSON を外部サイトから読み込ませて情報を抜けないか（XSSI）を確認する。"
  pass: "動的 JS/JSON がスクリプトとして読み込めない、または推測不能なトークンで保護される。"
  fail: "認証情報を含む JS/JSON を外部ページの script タグで読み込み、内容を取得できる。"
  note: "JSON 応答が配列リテラルのみ・JSONP 対応の場合に成立しやすい。"
  steps:
    - "JSON/JS を返す認証付きエンドポイントを、`<script src>` で外部ページから読み込めるか確認（`curl` で Content-Type も確認）"
    - "動的 JS・JSONP が Cookie 認証で機微データを返し、他サイトから読めないか（CSRF 的窃取）検証"
    - "`X-Content-Type-Options: nosniff`・適切な Content-Type・CSRF 対策の有無を確認"
    - "クロスサイトでデータを読み出せた場合は XSSI として finding に"

WSTG-APIT-01:
  purpose: "GraphQL（および同種の API）のスキーマ露出・クエリ乱用・認可漏れを確認する。"
  pass: "本番で introspection が無効、クエリ深さ・複雑度・件数に上限があり、フィールド単位で認可される。"
  fail: "introspection が有効でスキーマ全体を取得できる、深い入れ子やバッチクエリで DoS 相当になる、認可を経ずに他人のデータを取得できる。"
  note: "REST API も同じ枠で扱う。認可漏れは ATHZ 系のカードと合わせて報告する。"
  steps:
    - "GraphQL エンドポイントのイントロスペクションが有効か確認: `for ep in /graphql /api/graphql /v1/graphql /graphql/console; do echo \"===== $ep =====\"; curl -s -m 10 -H 'Content-Type: application/json' -d '{\"query\":\"{__schema{types{name}}}\"}' \"https://target$ep\" | head -c 800; echo; done | tee OUTDIR/graphql-introspection.txt`。`__schema` や型名が返れば有効＝スキーマ露出。返る ep を手順2以降の対象にする"
    - "スキーマから機微な query/mutation を洗い、認可なしで呼べないか確認"
    - "深いネスト/エイリアス量産でクエリコスト制限（DoS 耐性）・レート制限の有無を確認"
    - "バッチクエリで認可迂回・列挙ができないか試し、成立点を finding に"
  load_notes:   # 負荷・レート制限・ロック・DoS を招きうる手順への強調注釈（record.html/カードに出す）
    3: "深いネスト/エイリアス量産のクエリは、まさに GraphQL の DoS を誘発する検証。コスト制限が無いと1リクエストでサーバを落としうる。ネスト段数を段階的に上げる。"
