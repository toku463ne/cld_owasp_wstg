# WSTG 実施 Web をチームで共有するための nginx 設定例。
#
#   前提: serve_record.py と nginx は同じ機械（共用 Kali）で動かす。
#         serve_record.py は 127.0.0.1 でしか待ち受けないので、外から届くのは nginx だけ。
#
#   1) アプリ:   uv run scripts/serve_record.py --behind-proxy          （systemd 化は wstg-web.service）
#   2) 利用者:   sudo apt install -y nginx apache2-utils
#                sudo htpasswd -c /etc/nginx/wstg.htpasswd alice       # 2人目以降は -c を付けない
#   3) 証明書:   社内 CA の証明書を置く。無ければ自己署名（ブラウザで一度だけ例外を許可）:
#                sudo openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#                  -keyout /etc/ssl/private/wstg.key -out /etc/ssl/certs/wstg.crt -subj "/CN=wstg.internal"
#   4) 配置:     sudo cp templates/nginx/wstg.conf /etc/nginx/sites-available/wstg
#                sudo ln -s /etc/nginx/sites-available/wstg /etc/nginx/sites-enabled/wstg
#                sudo nginx -t && sudo systemctl reload nginx
#
#   注意:
#   - evidence（生エビデンス）がそのまま見えるので、社内ネットワーク限定・TLS・認証を外さない。
#   - location は / 固定（アプリはルート直下の絶対パスでリンクする。サブパス配下には置けない）。
#   - Host をそのまま渡す（書き込み API は Origin と Host の一致を見る）。
#   - X-Remote-User は nginx が必ず上書きする（利用者が送ったヘッダを通さない）。編集者名になる。

server {
    listen 80;
    server_name wstg.internal;          # 社内 DNS / hosts で引ける名前に合わせる
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wstg.internal;

    ssl_certificate     /etc/ssl/certs/wstg.crt;
    ssl_certificate_key /etc/ssl/private/wstg.key;

    # 社内ネットワークだけに絞る（環境に合わせる）
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny  all;

    auth_basic           "WSTG";
    auth_basic_user_file /etc/nginx/wstg.htpasswd;

    client_max_body_size 25m;           # 画像の貼り付け（base64）とコマンド出力の貼り付け

    location / {
        proxy_pass         http://127.0.0.1:8765;
        proxy_set_header   Host $http_host;   # ポート込み（Origin と照合する）
        proxy_set_header   X-Remote-User $remote_user;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
